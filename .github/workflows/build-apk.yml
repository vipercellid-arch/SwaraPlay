name: Build SwaraPlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read App Version
        id: ver
        run: |
          VER=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VER" ]; then VER="11.3.0"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SWARAPLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SWARAPLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWARAPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SWARAPLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/swaraplay-release.jks
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ -f app/swaraplay-release.jks ]; then
            echo "Using permanent committed app/swaraplay-release.jks"
            echo "SIGNING_STORE_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=swaraplay" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore app/swaraplay-release.jks \
              -alias swaraplay -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass swaraplay2026 -keypass swaraplay2026 \
              -dname "CN=SwaraPlay, OU=ViperCell, O=SwaraPlay, L=Ambon, S=Maluku, C=ID"
            echo "SIGNING_STORE_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=swaraplay" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
          fi

      - name: Build Mobile & TV Release APKs
        run: gradle :app:assembleMobileRelease :app:assembleTvRelease --no-daemon

      - name: Package Build Artifacts
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk "dist/SwaraPlay-v${VER}.apk"
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "dist/SwaraPlay-TV-v${VER}.apk"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwaraPlay-v${{ steps.ver.outputs.version }}-APKs
          path: dist/*.apk
          retention-days: 30
