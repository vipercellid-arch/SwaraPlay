name: Release SwaraPlay APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v6.4.0)'
        required: true
        default: 'v6.4.0'
      prerelease:
        description: 'Terbitkan sebagai Pra-Rilis (Pre-release)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            IS_PRE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            IS_PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_pre=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SWARAPLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SWARAPLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWARAPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SWARAPLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/swaraplay-release.jks
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ -f app/swaraplay-release.jks ]; then
            echo "Using permanent committed app/swaraplay-release.jks"
            echo "SIGNING_STORE_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=swaraplay" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore app/swaraplay-release.jks \
              -alias swaraplay -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass swaraplay2026 -keypass swaraplay2026 \
              -dname "CN=SwaraPlay, OU=ViperCell, O=SwaraPlay, L=Ambon, S=Maluku, C=ID"
            echo "SIGNING_STORE_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=swaraplay" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
          fi

      - name: Build Mobile & TV Release APKs
        run: gradle :app:assembleMobileRelease :app:assembleTvRelease --no-daemon --stacktrace

      - name: Package Release APKs
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk "dist/SwaraPlay-${TAG}.apk"
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "dist/SwaraPlay-TV-${TAG}.apk"
          ls -lh dist/

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRE="${{ steps.meta.outputs.is_pre }}"
          MOBILE_APK="dist/SwaraPlay-${TAG}.apk"
          TV_APK="dist/SwaraPlay-TV-${TAG}.apk"
          NOTES="Pra-rilis SwaraPlay ${TAG} (Release Build + Permanent Signing) — HUD Pemutar Video (Kecerahan, Suara, Kunci Layar, Kecepatan, Rasio), Subtitle 1-Klik Tersinkronisasi + Penyesuaian Offset, Perbaikan Total Anime, Pilihan Teratas Realtime, Infinite Scroll Katalog, Pop-up Trailer Auto-Play, Pencarian & Rentang Episode, dan 0 Poster Kosong."
          FLAGS=""
          if [ "$IS_PRE" = "true" ]; then
            FLAGS="--prerelease"
          fi
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MOBILE_APK" "$TV_APK" --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" "$MOBILE_APK" "$TV_APK" \
              -R "${{ github.repository }}" \
              --title "SwaraPlay ${TAG}" \
              --notes "$NOTES" \
              $FLAGS
          fi
