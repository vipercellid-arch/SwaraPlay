name: Release SwaraPlay APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v2.0.0)'
        required: true
        default: 'v2.0.0'
      prerelease:
        description: 'Tandai sebagai Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=SwaraPlay-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SWARAPLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SWARAPLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWARAPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SWARAPLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/swaraplay-release.jks
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkey -v -keystore app/swaraplay-release.jks \
              -alias swaraplay -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass swaraplay2026 -keypass swaraplay2026 \
              -dname "CN=SwaraPlay, OU=ViperCell, O=SwaraPlay, L=Ambon, S=Maluku, C=ID"
            echo "SIGNING_STORE_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=swaraplay" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=swaraplay2026" >> "$GITHUB_ENV"
          fi

      - name: Build SwaraPlay Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Package Release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.meta.outputs.apk_name }}"
          ls -lh "dist/${{ steps.meta.outputs.apk_name }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APK_PATH="dist/${{ steps.meta.outputs.apk_name }}"
          NOTES="Rilis SwaraPlay ${TAG} — UI OLED ala Swara, Player True Fullscreen Landscape, 8+ Server Streaming Gratis Tanpa Login, DNS-over-HTTPS Bypass ISP, Subtitle Wyzie, QRIS ViperCell & Auto-Updater."
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          fi
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" "$APK_PATH" \
              -R "${{ github.repository }}" \
              --title "SwaraPlay ${TAG}" \
              --notes "$NOTES" \
              $FLAGS
          fi
