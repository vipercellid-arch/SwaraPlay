<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0C" />
  <title>SwaraPlay — Streaming Film, Serial, Drama Asia & Anime</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0A0A0C;
      --surface: #121216;
      --surface2: #1A1A20;
      --border: rgba(255, 255, 255, 0.09);
      --text: #FFFFFF;
      --muted: #A1A1AA;
      --accent: #FFFFFF;
      --gold: #F5C518;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ===== TOP NAVBAR (DESKTOP & MOBILE) ===== */
    .topbar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      width: min(1320px, calc(100% - 28px)); z-index: 60;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 10px 18px; border-radius: 999px;
      background: rgba(14, 14, 18, 0.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border); box-shadow: 0 10px 34px rgba(0,0,0,0.45);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .topbar.hidden-nav { display: none; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; cursor: pointer; flex-shrink: 0; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; }

    .nav-tabs { display: flex; align-items: center; gap: 4px; }
    .nav-btn {
      padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); transition: all 0.18s ease; white-space: nowrap;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-btn.active { background: #fff; color: #0A0A0C; }

    .search-form {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 5px 4px 14px; width: 250px; transition: border-color 0.2s;
    }
    .search-form:focus-within { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.1); }
    .search-form input {
      width: 100%; background: none; border: none; outline: none; color: #fff; font-size: 13.5px;
    }
    .search-form input::placeholder { color: #71717A; }
    .search-submit-btn {
      padding: 6px 12px; border-radius: 999px; background: #fff; color: #0A0A0C;
      font-size: 12px; font-weight: 700; flex-shrink: 0; transition: opacity 0.15s;
    }
    .search-submit-btn:hover { opacity: 0.88; }

    .mobile-search-trigger {
      display: none; width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.09); border: 1px solid var(--border);
      align-items: center; justify-content: center;
    }

    /* Mobile Search Overlay */
    .mobile-search-bar {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 95;
      padding: 12px 14px; background: rgba(10,10,12,0.97); border-bottom: 1px solid var(--border);
      gap: 8px; align-items: center;
    }
    .mobile-search-bar.open { display: flex; }
    .mobile-search-bar form { flex: 1; display: flex; gap: 8px; align-items: center; }
    .mobile-search-bar input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
      padding: 10px 16px; color: #fff; font-size: 14px; outline: none;
    }

    /* ===== FLOATING BOTTOM PILL (MOBILE ONLY) ===== */
    .mobile-bottom-nav {
      display: none; position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 460px; z-index: 70;
      background: rgba(16, 16, 20, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 6px 8px;
      justify-content: space-around; align-items: center; box-shadow: 0 12px 32px rgba(0,0,0,0.65);
    }
    .mobile-bottom-nav.hidden-nav { display: none !important; }
    .mnav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 10px; border-radius: 999px; color: var(--muted); font-size: 10px; font-weight: 600;
      transition: all 0.18s;
    }
    .mnav-btn svg { width: 19px; height: 19px; }
    .mnav-btn.active { background: #fff; color: #0A0A0C; }

    /* ===== HERO BANNER ===== */
    .hero {
      position: relative; width: 100%; min-height: 74vh; display: flex; align-items: flex-end;
      padding: 110px 4% 48px; background-size: cover; background-position: center 22%;
      overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(10,10,12,0.94) 0%, rgba(10,10,12,0.58) 52%, rgba(10,10,12,0.18) 100%),
                  linear-gradient(0deg, #0A0A0C 0%, rgba(10,10,12,0.25) 45%, rgba(10,10,12,0.5) 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 620px; }
    .hero-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: 12.5px; color: #D4D4D8; font-weight: 600; }
    .badge { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }
    .hero h1 { font-size: clamp(28px, 4.6vw, 52px); font-weight: 900; line-height: 1.08; letter-spacing: -0.025em; margin-bottom: 12px; }
    .hero p { font-size: 14.5px; line-height: 1.55; color: #D4D4D8; margin-bottom: 22px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px;
      background: #fff; color: #0A0A0C; font-weight: 800; font-size: 14px; transition: transform 0.15s, opacity 0.15s;
    }
    .btn-primary:hover { transform: scale(1.03); }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16); color: #fff;
      font-weight: 700; font-size: 14px; backdrop-filter: blur(10px); transition: background 0.15s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }

    .hero { transition: background-image 0.6s ease; }
    .hero-controls {
      position: absolute; right: 4%; bottom: 26px; z-index: 4;
      display: flex; align-items: center; gap: 10px;
    }
    .hero-arrow {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(14,14,18,0.68); border: 1px solid rgba(255,255,255,0.18);
      color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); transition: background 0.15s;
    }
    .hero-arrow:hover { background: rgba(255,255,255,0.22); }
    .hero-dots { display: flex; align-items: center; gap: 6px; }
    .hero-dot {
      width: 7px; height: 7px; border-radius: 999px; background: rgba(255,255,255,0.34);
      transition: all 0.25s ease; cursor: pointer;
    }
    .hero-dot.active { width: 22px; background: #fff; }

    /* ===== MAIN CATALOG & SHELVES ===== */
    main { padding: 12px 4% 96px; max-width: 1480px; margin: 0 auto; }
    .section { margin-bottom: 34px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
    .section-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.015em; }
    .section-sub { font-size: 12.5px; color: var(--muted); }

    /* Browse by Provider Strip (Cinejoy style) */
    .provider-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .provider-strip::-webkit-scrollbar { display: none; }
    .provider-pill {
      display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border); flex-shrink: 0;
      font-size: 13px; font-weight: 700; color: #D4D4D8; transition: all 0.18s;
    }
    .provider-pill:hover { border-color: rgba(255,255,255,0.28); color: #fff; }
    .provider-pill.active { background: #fff; color: #0A0A0C; border-color: #fff; }
    .provider-dot { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; }

    /* Filter Chips */
    .filter-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
    .filter-strip::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 15px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; transition: all 0.16s;
    }
    .chip.active { background: #fff; color: #0A0A0C; border-color: #fff; }

    /* Horizontal Shelf & Responsive Grid */
    .shelf { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; scroll-snap-type: x proximity; }
    .shelf::-webkit-scrollbar { display: none; }
    .shelf .card { width: 162px; flex-shrink: 0; scroll-snap-align: start; }

    .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 18px 14px; }

    .card { cursor: pointer; transition: transform 0.2s ease; }
    .card:hover { transform: translateY(-4px); }
    .poster-wrap {
      position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 12px;
      overflow: hidden; background: var(--surface2); border: 1px solid rgba(255,255,255,0.06);
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s; }
    .card:hover .poster-wrap img { transform: scale(1.04); }
    .rating-tag {
      position: absolute; top: 8px; right: 8px; padding: 3px 7px; border-radius: 7px;
      background: rgba(10,10,12,0.82); backdrop-filter: blur(6px);
      font-size: 11px; font-weight: 800; color: var(--gold); border: 1px solid rgba(255,255,255,0.1);
    }
    .card-title { margin-top: 8px; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { margin-top: 2px; font-size: 11.5px; color: var(--muted); }

    .load-more-wrap { display: flex; justify-content: center; margin-top: 28px; }
    .btn-load-more {
      padding: 12px 28px; border-radius: 999px; background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.16); color: #fff; font-weight: 700; font-size: 13.5px;
    }
    .btn-load-more:hover { background: #fff; color: #0A0A0C; }

    /* ===== FULL-PAGE DETAIL VIEW (CINEJOY STYLE — ZERO POPUP!) ===== */
    #detailView { display: none; min-height: 100vh; background: var(--bg); padding-bottom: 96px; }
    #detailView.active { display: block; }
    .detail-hero {
      position: relative; width: 100%; min-height: 68vh; display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px 4% 38px; background-size: cover; background-position: center 20%;
    }
    .detail-hero::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(10,10,12,0.94) 0%, rgba(10,10,12,0.52) 55%, rgba(10,10,12,0.22) 100%),
                  linear-gradient(0deg, #0A0A0C 0%, rgba(10,10,12,0.35) 50%, rgba(10,10,12,0.55) 100%);
    }
    .detail-top-bar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; }
    .back-pill {
      display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px;
      background: rgba(14,14,18,0.72); backdrop-filter: blur(12px); border: 1px solid var(--border);
      font-weight: 700; font-size: 13.5px;
    }
    .back-pill:hover { background: rgba(255,255,255,0.16); }

    .detail-hero-body {
      position: relative; z-index: 3; display: flex; align-items: flex-end; justify-content: space-between;
      gap: 28px; margin-top: 120px; flex-wrap: wrap;
    }
    .detail-main-col { max-width: 660px; flex: 1; min-width: 280px; }
    .detail-title { font-size: clamp(30px, 5vw, 54px); font-weight: 900; line-height: 1.06; letter-spacing: -0.025em; margin-bottom: 10px; }
    .detail-genres { font-size: 14px; color: #D4D4D8; font-weight: 600; margin-bottom: 20px; }

    .detail-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .detail-play-btn {
      display: inline-flex; align-items: center; gap: 9px; padding: 13px 30px; border-radius: 999px;
      background: #fff; color: #0A0A0C; font-weight: 800; font-size: 15px; transition: transform 0.15s;
    }
    .detail-play-btn:hover { transform: scale(1.03); }
    .icon-circle-btn {
      width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(10px);
      font-size: 18px; transition: background 0.15s;
    }
    .icon-circle-btn:hover, .icon-circle-btn.saved { background: #fff; color: #0A0A0C; }

    .detail-meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 13px; color: #D4D4D8; margin-bottom: 8px; }
    .meta-box { padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.22); font-size: 11px; font-weight: 700; }
    .detail-directors { font-size: 13px; color: var(--muted); }

    /* Glass Info Card on Right (Cinejoy Style) */
    .detail-info-card {
      width: 280px; padding: 16px 18px; border-radius: 16px;
      background: rgba(20, 20, 26, 0.72); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 10px;
    }
    .info-row { display: flex; justify-content: space-between; font-size: 12.5px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 8px; }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row span:first-child { color: var(--muted); }
    .info-row span:last-child { font-weight: 700; text-align: right; }

    .detail-body { padding: 12px 4% 40px; max-width: 1440px; margin: 0 auto; }
    .detail-synopsis { max-width: 780px; font-size: 14.5px; line-height: 1.65; color: #D4D4D8; margin-bottom: 28px; }
    .detail-section-title { font-size: 19px; font-weight: 800; margin: 28px 0 14px; }

    /* Cast Row (Circular Avatars like Cinejoy) */
    .cast-row { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .cast-row::-webkit-scrollbar { display: none; }
    .cast-item { width: 92px; flex-shrink: 0; text-align: center; }
    .cast-avatar {
      width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 8px; overflow: hidden;
      background: var(--surface2); border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #A1A1AA;
    }
    .cast-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .cast-name { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
    .cast-role { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Episodes Section */
    .season-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .ep-card {
      padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border);
      text-align: left; transition: all 0.16s;
    }
    .ep-card:hover { background: #fff; color: #0A0A0C; border-color: #fff; }
    .ep-card .ep-num { font-size: 11.5px; font-weight: 800; opacity: 0.72; }
    .ep-card .ep-title { font-size: 13px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .trailer-box { max-width: 480px; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #141418; border: 1px solid var(--border); }
    .trailer-box iframe { width: 100%; height: 100%; border: none; }

    /* ===== FULLSCREEN CINEMA PLAYER (CINEJOY STYLE — ZERO POPUP, ZERO DIAGNOSTICS!) ===== */
    #watchView {
      display: none; position: fixed; inset: 0; z-index: 200; background: #000000;
      flex-direction: column; justify-content: center; align-items: center; user-select: none;
    }
    #watchView.active { display: flex; }
    #watchVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }

    /* Minimal subtle spinner ONLY while first frame buffers (ZERO text "mencari endpoint aktif") */
    .player-spinner {
      position: absolute; width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.18); border-top-color: #fff;
      animation: spin 0.75s linear infinite; pointer-events: none; z-index: 4; display: none;
    }
    .player-spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-hud {
      position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 26px max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.86) 100%);
      transition: opacity 0.25s ease;
    }
    .player-hud.hide { opacity: 0; pointer-events: none; }

    .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .hud-icon-btn {
      width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; transition: background 0.15s;
    }
    .hud-icon-btn:hover { background: rgba(255,255,255,0.14); }
    .hud-title { font-size: 16px; font-weight: 700; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .hud-center { display: flex; align-items: center; justify-content: center; gap: 44px; }
    .hud-seek-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; opacity: 0.92; transition: transform 0.15s; }
    .hud-seek-btn:hover { transform: scale(1.1); }
    .hud-play-btn {
      width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; transition: transform 0.15s;
    }
    .hud-play-btn:hover { transform: scale(1.08); }

    .hud-bottom { display: flex; flex-direction: column; gap: 12px; }
    .seek-row { display: flex; align-items: center; gap: 14px; }
    .time-label { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: #E4E4E7; min-width: 46px; }
    .seek-slider {
      flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px;
      background: rgba(255,255,255,0.28); outline: none; cursor: pointer;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer;
    }

    .hud-actions-bar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 22px; }
    .hud-action-item {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: #E4E4E7; transition: background 0.15s, color 0.15s;
    }
    .hud-action-item:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .hud-action-item svg { width: 17px; height: 17px; }

    /* Player Bottom Sheet (Servers / Subtitles / Episodes / Settings) */
    .player-sheet {
      display: none; position: absolute; right: 20px; bottom: 82px; z-index: 12;
      width: min(360px, calc(100% - 32px)); max-height: 62vh; overflow-y: auto;
      background: rgba(16, 16, 22, 0.96); backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 14px;
      box-shadow: 0 18px 46px rgba(0,0,0,0.75);
    }
    .player-sheet.open { display: block; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .sheet-head h4 { font-size: 14px; font-weight: 800; }
    .sheet-list { display: flex; flex-direction: column; gap: 6px; }
    .sheet-opt {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.05);
      font-size: 13px; font-weight: 600; text-align: left; transition: background 0.15s;
    }
    .sheet-opt:hover { background: rgba(255,255,255,0.12); }
    .sheet-opt.active { background: #fff; color: #0A0A0C; }

    /* Toast */
    .toast {
      position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); z-index: 300;
      padding: 10px 18px; border-radius: 999px; background: rgba(24,24,30,0.95);
      border: 1px solid rgba(255,255,255,0.15); font-size: 13px; font-weight: 600;
      display: none;
    }
    .toast.show { display: block; }

    /* ===== MOBILE RESPONSIVE (MATANG & PROPORSIONAL) ===== */
    @media (max-width: 820px) {
      .topbar { top: 10px; padding: 8px 14px; width: calc(100% - 20px); }
      .nav-tabs, .search-form { display: none; }
      .mobile-search-trigger { display: inline-flex; }
      .mobile-bottom-nav { display: flex; }

      .hero { min-height: 58vh; padding: 84px 16px 28px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 13px; -webkit-line-clamp: 2; margin-bottom: 16px; }
      .btn-primary, .btn-secondary { padding: 10px 18px; font-size: 13px; }

      main { padding: 8px 14px 104px; }
      .section-head h2 { font-size: 17px; }
      .shelf { gap: 10px; }
      .shelf .card { width: 122px; }
      .grid-view { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 9px; }
      .card-title { font-size: 12px; }
      .card-sub { font-size: 10.5px; }

      .detail-hero { min-height: 54vh; padding: 14px 16px 24px; }

      .player-hud { padding: 14px 14px max(14px, env(safe-area-inset-bottom)); }

      .player-sheet { right: 12px; left: 12px; width: auto; bottom: 76px; }
    }
    @media (max-width: 360px) {
      .grid-view { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

  <div class="toast" id="toast"></div>

  <script>
    // ===== STATE =====
    let catalog = { movies: [], series: [], awardMovies: [], awardSeries: [], action: [], dramas: [], animeTrend: [], animeTop: [] };
    let activeTab = "home";
        let myList = JSON.parse(localStorage.getItem("swaraplay_mylist") || "[]");

    // Category pagination state
    const catState = {
      movie: { genre: "", page: 1, items: [], hasMore: true },
      series: { genre: "", page: 1, items: [], hasMore: true },
      drama: { genre: "", page: 1, items: [], hasMore: true },
      anime: { genre: "Trending", page: 1, items: [], hasMore: true },
    };
    let heroSlides = [];
    let heroIdx = 0;
    let heroTimer = null;

    const CATEGORY_FILTERS = {
      movie: ["Semua", "Action", "Sci-Fi", "Horror", "Comedy", "Animation", "Thriller", "Fantasy", "Romance", "Crime"],
      series: ["Semua", "Drama", "Action", "Sci-Fi", "Crime", "Comedy", "Animation", "Mystery"],
      drama: ["Semua", "Korea", "China", "Jepang", "Thailand"],
      anime: ["Trending", "Populer", "Rating Tertinggi"],
    };

    const itemStore = new Map();
    function registerItem(item) {
      const k = `${item.category}_${item.id}`;
      itemStore.set(k, item);
      return k;
    }

    // Detail & Player state
    let currentDetailItem = null;
    let currentDetailData = null;
    let currentWatchItem = null;
    let currentSeason = 1;
    let currentEpisode = 1;
    let currentServers = [];
    let currentSubtitles = [];
    let currentServerIdx = 0;
    let activeSubIdx = -1;
    let hlsInstance = null;
    let hudTimer = null;
    let openSheetType = null;
    const preResolveCache = new Map();

    // ===== UTILS =====
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._tm);
      t._tm = setTimeout(() => t.classList.remove("show"), 2400);
    }
    function isSaved(item) {
      return myList.some((x) => x.id === item.id && x.category === item.category);
    }
    function toggleSave(item) {
      if (!item) return;
      if (isSaved(item)) {
        myList = myList.filter((x) => !(x.id === item.id && x.category === item.category));
        showToast("Dihapus dari Daftar Saya");
      } else {
        myList.unshift(item);
        showToast("Disimpan ke Daftar Saya");
      }
      localStorage.setItem("swaraplay_mylist", JSON.stringify(myList.slice(0, 120)));
      if (activeTab === "mylist") renderMain();
      updateDetailSaveBtn();
    }
    function formatTime(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "0:00";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
    }

    // ===== CARDS & HERO =====
    function cardHtml(item) {
      const key = registerItem(item);
      const catLabel = item.category === "MOVIE" ? "Film" : item.category === "SERIES" ? "Serial" : item.category === "ASIAN_DRAMA" ? "Drama" : "Anime";
      return `
        <div class="card" onclick="openDetailByKey('${esc(key)}')">
          <div class="poster-wrap">
            <img loading="lazy" src="${esc(item.poster)}" alt="${esc(item.title)}" onerror="this.src='/logo.png'" />
            ${item.rating ? `<span class="rating-tag">★ ${esc(item.rating)}</span>` : ""}
          </div>
          <div class="card-title">${esc(item.title)}</div>
          <div class="card-sub">${esc(item.year || "")}${item.year ? " • " : ""}${catLabel}</div>
        </div>
      `;
    }

    function shelfHtml(title, items) {
      if (!items || !items.length) return "";
      return `
        <section class="section">
          <div class="section-head"><h2>${esc(title)}</h2></div>
          <div class="shelf">${items.slice(0, 24).map(cardHtml).join("")}</div>
        </section>
      `;
    }

    function setHero(item) {
      if (!item) return;
      const hero = document.getElementById("hero");
      hero.style.backgroundImage = `url('${item.backdrop || item.poster}')`;
      document.getElementById("heroMeta").innerHTML = `
        <span class="badge">${item.category === "MOVIE" ? "FILM" : item.category === "SERIES" ? "SERIAL" : item.category === "ANIME" ? "ANIME" : "DRAMA ASIA"}</span>
        ${item.year ? `<span>${esc(item.year)}</span>` : ""}
        ${item.rating ? `<span style="color:var(--gold)">★ ${esc(item.rating)}</span>` : ""}
        ${(item.genres || []).slice(0, 2).map((g) => `<span>• ${esc(g)}</span>`).join("")}
      `;
      document.getElementById("heroTitle").textContent = item.title;
      document.getElementById("heroDesc").textContent = item.overview || "Streaming kualitas HD dengan subtitle Bahasa Indonesia.";
      document.getElementById("heroPlayBtn").onclick = () => startWatch(item, 1, 1);
      document.getElementById("heroDetailBtn").onclick = () => openDetail(item);
      const listBtn = document.getElementById("heroListBtn");
      listBtn.textContent = isSaved(item) ? "✓ Tersimpan" : "+ Daftar Saya";
      listBtn.onclick = () => {
        toggleSave(item);
        listBtn.textContent = isSaved(item) ? "✓ Tersimpan" : "+ Daftar Saya";
      };
    }


    function renderHeroDots() {
      const dotsEl = document.getElementById("heroDots");
      if (!dotsEl) return;
      dotsEl.innerHTML = heroSlides.map((_, i) =>
        `<span class="hero-dot ${i === heroIdx ? "active" : ""}" onclick="goHeroSlide(${i})"></span>`
      ).join("");
    }
    window.goHeroSlide = (idx) => {
      if (!heroSlides.length) return;
      heroIdx = ((idx % heroSlides.length) + heroSlides.length) % heroSlides.length;
      setHero(heroSlides[heroIdx]);
      renderHeroDots();
      restartHeroTimer();
    };
    window.stepHero = (delta) => goHeroSlide(heroIdx + delta);
    function restartHeroTimer() {
      clearInterval(heroTimer);
      if (heroSlides.length <= 1) return;
      heroTimer = setInterval(() => {
        if (activeTab === "home" && !document.getElementById("detailView").classList.contains("active") && !document.getElementById("watchView").classList.contains("active")) {
          heroIdx = (heroIdx + 1) % heroSlides.length;
          setHero(heroSlides[heroIdx]);
          renderHeroDots();
        }
      }, 6000);
    }

    function rotateList(arr, offset) {
      if (!arr || !arr.length) return [];
      const n = (offset * 5) % arr.length;
      return arr.slice(n).concat(arr.slice(0, n));
    }

    // ===== NAVIGATION & TABS =====
    function syncNavActive(tab) {
      document.querySelectorAll(".nav-btn, .mnav-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
    }

    window.goHome = () => setTab("home");

    window.setTab = async (tab) => {
      activeTab = tab;
      closeDetail(false);
      syncNavActive(tab);
      document.getElementById("hero").style.display = tab === "home" ? "flex" : "none";
      window.scrollTo({ top: 0, behavior: "instant" });

      if (["movie", "series", "drama", "anime"].includes(tab) && !catState[tab].items.length) {
        if (tab === "movie") catState.movie.items = catalog.movies.slice();
        if (tab === "series") catState.series.items = catalog.series.slice();
        if (tab === "drama") catState.drama.items = catalog.dramas.slice();
        if (tab === "anime") catState.anime.items = catalog.animeTrend.concat(catalog.animeTop);
      }
      renderMain();
    };

    window.selectCategoryFilter = async (cat, filterVal) => {
      const apiGenre = filterVal === "Semua" ? "" : filterVal;
      catState[cat].genre = filterVal;
      catState[cat].page = 1;
      catState[cat].hasMore = true;
      document.getElementById("mainContent").innerHTML = `<section class="section" style="padding-top:88px;"><p style="color:var(--muted);">Memuat katalog...</p></section>`;
      const res = await fetch(`/api/catalog/category?cat=${cat}&genre=${encodeURIComponent(apiGenre)}&page=1`).then((r) => r.json()).catch(() => ({ items: [] }));
      catState[cat].items = res.items || [];
      catState[cat].hasMore = Boolean(res.hasMore);
      renderMain();
    };

    window.loadMoreCategory = async (cat) => {
      const st = catState[cat];
      st.page += 1;
      const btn = document.getElementById("loadMoreBtn");
      if (btn) btn.textContent = "Memuat...";
      const apiGenre = st.genre === "Semua" ? "" : st.genre;
      const res = await fetch(`/api/catalog/category?cat=${cat}&genre=${encodeURIComponent(apiGenre)}&page=${st.page}`).then((r) => r.json()).catch(() => ({ items: [] }));
      const newItems = res.items || [];
      const existingIds = new Set(st.items.map((x) => `${x.category}_${x.id}`));
      for (const it of newItems) {
        if (!existingIds.has(`${it.category}_${it.id}`)) st.items.push(it);
      }
      st.hasMore = Boolean(res.hasMore && newItems.length > 0);
      renderMain();

    // ===== PRE-RESOLVE STREAM IN BACKGROUND (ZERO WAIT SAAT PUTAR) =====
    function buildResolveUrl(item, season, episode, fast = true) {
      const q = new URLSearchParams({
        id: item.id || "",
        imdbId: item.imdbId || "",
        tmdbId: item.tmdbId || "",
        aniListId: item.aniListId || "",
        malId: item.malId || "",
        kisskhId: item.kisskhId || "",
        title: item.title || "",
        year: item.year || "",
        category: item.category || "MOVIE",
        season: String(season || 1),
        episode: String(episode || 1),
        fast: fast ? "1" : "0",
      });
      return `/api/resolve?${q.toString()}`;
    }

    function preResolveStream(item, season = 1, episode = 1) {
      const k = `${item.id}_${season}_${episode}`;
      if (preResolveCache.has(k)) return preResolveCache.get(k);
      const p = fetch(buildResolveUrl(item, season, episode, true))
        .then((r) => r.json())
        .catch(() => ({ servers: [], subtitles: [] }));
      preResolveCache.set(k, p);
      return p;
    }

    function renderDetailEpisodes(item, allEpisodes, activeSeason) {

    window.switchDetailSeason = (s) => {

    window.closeDetail = (restoreBrowse = true) => {

    // ===== FULLSCREEN CINEMA PLAYER (SAAT NONTON — CINEJOY STYLE, LANGSUNG PUTAR!) =====
    const videoEl = document.getElementById("watchVideo");
    const spinnerEl = document.getElementById("playerSpinner");
    const hudEl = document.getElementById("playerHud");
    const seekSlider = document.getElementById("seekSlider");

    function showHud() {
      hudEl.classList.remove("hide");
      clearTimeout(hudTimer);
      if (!videoEl.paused && !openSheetType) {
        hudTimer = setTimeout(() => hudEl.classList.add("hide"), 3200);
      }
    }

    document.getElementById("watchView").addEventListener("mousemove", showHud);
    document.getElementById("watchView").addEventListener("click", (e) => {
      if (e.target === videoEl || e.target === hudEl) {
        if (openSheetType) closeSheet();
        else if (hudEl.classList.contains("hide")) showHud();
        else hudEl.classList.add("hide");
      }
    });

    videoEl.addEventListener("waiting", () => spinnerEl.classList.add("show"));
    videoEl.addEventListener("playing", () => {
      spinnerEl.classList.remove("show");
      updatePlayIcon();
      showHud();
    });
    videoEl.addEventListener("pause", () => {
      updatePlayIcon();
      hudEl.classList.remove("hide");
    });
    videoEl.addEventListener("timeupdate", () => {
      if (!videoEl.duration) return;
      document.getElementById("timeCurrent").textContent = formatTime(videoEl.currentTime);
      document.getElementById("timeDuration").textContent = formatTime(videoEl.duration);
      seekSlider.value = String((videoEl.currentTime / videoEl.duration) * 100);
    });
    seekSlider.addEventListener("input", () => {
      if (videoEl.duration) videoEl.currentTime = (Number(seekSlider.value) / 100) * videoEl.duration;
    });

    function updatePlayIcon() {
      const icon = document.getElementById("playPauseIcon");
      if (videoEl.paused) {
        icon.innerHTML = `<polygon points="6 4 20 12 6 20 6 4"/>`;
      } else {
        icon.innerHTML = `<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`;
      }
    }

    window.togglePlayPause = () => {
      if (videoEl.paused) videoEl.play().catch(() => {});
      else videoEl.pause();
    };
    window.seekBy = (delta) => {
      if (!Number.isFinite(videoEl.currentTime)) return;
      videoEl.currentTime = Math.max(0, Math.min(videoEl.duration || 99999, videoEl.currentTime + delta));
      showHud();
    };
    window.togglePiP = async () => {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await videoEl.requestPictureInPicture();
      } catch {}
    };
    window.toggleFullscreen = () => {
      const el = document.getElementById("watchView");
      if (!document.fullscreenElement) el.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    };

    async function startWatch(item, season = 1, episode = 1) {
      currentWatchItem = item;
      currentSeason = season;
      currentEpisode = episode;
      currentServers = [];
      currentSubtitles = [];
      currentServerIdx = 0;
      activeSubIdx = -1;
      closeSheet();

      document.getElementById("mobileBottomNav").classList.add("hidden-nav");
      document.getElementById("watchView").classList.add("active");
      document.getElementById("watchTitle").textContent =
        item.category === "MOVIE" ? item.title : `${item.title} • S${season} E${episode}`;
      document.getElementById("hudEpisodesBtn").style.display =
        item.category !== "MOVIE" && currentDetailData?.episodes?.length ? "inline-flex" : "none";

      spinnerEl.classList.add("show");
      showHud();

      // 0. Ambil subtitle multi-sumber (OpenSubtitles v3 + Wyzie) secara paralel & independen!
      const subParams = new URLSearchParams({
        id: item.id || "",
        imdbId: item.imdbId || "",
        tmdbId: item.tmdbId || "",
        title: item.title || "",
        category: item.category || "MOVIE",
        season: String(season || 1),
        episode: String(episode || 1),
      });
      fetch(`/api/subtitles?${subParams.toString()}`)
        .then((r) => r.json())
        .then((subRes) => {
          if (currentWatchItem?.id !== item.id || currentEpisode !== episode) return;
          mergeSubtitles(subRes?.subtitles || [], []);
          if (openSheetType === "subtitles") renderSheet("subtitles");
        })
        .catch(() => {});

      // 1. Ambil hasil pre-resolve atau First-Wins instant race (langsung putar!)
      const fastData = await preResolveStream(item, season, episode);
      if (currentWatchItem?.id !== item.id || currentEpisode !== episode) return;

      currentServers = (fastData?.servers || []).slice();
      mergeSubtitles(fastData?.subtitles || [], currentServers[0]?.subtitles || []);

      if (currentServers.length > 0) {
        playServerIndex(0);
      } else {
        // Jika fast race belum dapat, tunggu full resolve diam-diam
        const fullData = await fetch(buildResolveUrl(item, season, episode, false)).then((r) => r.json()).catch(() => ({ servers: [], subtitles: [] }));
        if (currentWatchItem?.id !== item.id || currentEpisode !== episode) return;
        currentServers = (fullData?.servers || []).slice();
        mergeSubtitles(fullData?.subtitles || [], currentServers[0]?.subtitles || []);
        if (currentServers.length > 0) playServerIndex(0);
        else {
          spinnerEl.classList.remove("show");
          showToast("Server sementara sibuk, coba episode atau judul lain.");
        }
      }

      // 2. Di background, kumpulkan sisa server cadangan agar menu Servers lengkap
      if (!fastData?.done) {
        fetch(buildResolveUrl(item, season, episode, false))
          .then((r) => r.json())
          .then((fullData) => {
            if (currentWatchItem?.id !== item.id || currentEpisode !== episode) return;
            const seen = new Set(currentServers.map((s) => s.streamUrl));
            for (const s of fullData?.servers || []) {
              if (s?.streamUrl && !seen.has(s.streamUrl)) {
                seen.add(s.streamUrl);
                currentServers.push(s);
              }
            }
            mergeSubtitles(fullData?.subtitles || [], []);
            if (openSheetType === "servers") renderSheet("servers");
            if (openSheetType === "subtitles") renderSheet("subtitles");
          })
          .catch(() => {});
      }
    }

    function mergeSubtitles(wyzieSubs, serverSubs) {
      const combined = [...(serverSubs || []), ...(wyzieSubs || [])];
      const seen = new Set(currentSubtitles.map((s) => s.url));
      for (const s of combined) {
        if (s?.url && !seen.has(s.url)) {
          seen.add(s.url);
          currentSubtitles.push(s);
        }
      }
      if (activeSubIdx === -1 && currentSubtitles.length > 0) {
        const indoIdx = currentSubtitles.findIndex((s) => s.lang.includes("id") || s.lang.includes("indo"));
        applySubtitle(indoIdx >= 0 ? indoIdx : 0);
      }
    }

    function applySubtitle(idx) {
      activeSubIdx = idx;
      videoEl.querySelectorAll("track").forEach((t) => t.remove());
      if (idx >= 0 && currentSubtitles[idx]) {
        const tr = document.createElement("track");
        tr.kind = "subtitles";
        tr.label = currentSubtitles[idx].label;
        tr.srclang = "id";
        tr.src = currentSubtitles[idx].url;
        tr.default = true;
        videoEl.appendChild(tr);
        setTimeout(() => {
          if (videoEl.textTracks[0]) videoEl.textTracks[0].mode = "showing";
        }, 120);
      }
    }

    function playServerIndex(idx) {
      const srv = currentServers[idx];
      if (!srv) return;
      currentServerIdx = idx;
      spinnerEl.classList.add("show");
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

      const src = srv.proxyUrl;
      const failOver = () => {
        if (currentServerIdx + 1 < currentServers.length) {
          playServerIndex(currentServerIdx + 1);
        } else {
          spinnerEl.classList.remove("show");
        }
      };

      if (srv.subtitleUrl && !currentSubtitles.some((s) => s.url === srv.subtitleUrl)) {
        currentSubtitles.unshift({ label: `${srv.name} Subtitle`, lang: "id", url: srv.subtitleUrl });
        applySubtitle(0);
      }

      if (window.Hls && Hls.isSupported() && !/\.mp4(\?|$)/i.test(srv.streamUrl)) {
        hlsInstance = new Hls({ maxBufferLength: 30, enableWorker: true });
        hlsInstance.loadSource(src);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) failOver();
        });
      } else {
        videoEl.src = src;
        videoEl.onerror = failOver;
        videoEl.play().catch(() => {});
      }
    }

    window.closePlayer = () => {
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      document.getElementById("watchView").classList.remove("active");
      document.getElementById("mobileBottomNav").classList.remove("hidden-nav");
      closeSheet();
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load();
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      spinnerEl.classList.remove("show");
    };

    // ===== PLAYER BOTTOM SHEET (SERVERS / SUBTITLES / EPISODES / SETTINGS) =====
    window.toggleSheet = (type) => {
      if (openSheetType === type) return closeSheet();
      openSheetType = type;
      renderSheet(type);
      document.getElementById("playerSheet").classList.add("open");
      clearTimeout(hudTimer);
    };
    window.closeSheet = () => {
      openSheetType = null;
      document.getElementById("playerSheet").classList.remove("open");
    };

    function renderSheet(type) {
      const titleEl = document.getElementById("sheetTitle");
      const bodyEl = document.getElementById("sheetBody");

      if (type === "servers") {
        titleEl.textContent = `Servers (${currentServers.length})`;
        bodyEl.innerHTML = currentServers.length
          ? currentServers.map((s, i) => `
              <button class="sheet-opt ${i === currentServerIdx ? "active" : ""}" onclick="playServerIndex(${i}); closeSheet();">
                <span>${esc(s.name)}</span>
                <span style="opacity:0.75;font-size:11.5px;">${esc(s.quality)}</span>
              </button>
            `).join("")
          : `<p style="color:var(--muted);font-size:13px;">Memuat daftar server...</p>`;
      } else if (type === "subtitles") {
        titleEl.textContent = "Subtitles";
        bodyEl.innerHTML = `
          <button class="sheet-opt ${activeSubIdx === -1 ? "active" : ""}" onclick="applySubtitle(-1); closeSheet();">Matikan Subtitle</button>
          ${currentSubtitles.map((s, i) => `
            <button class="sheet-opt ${i === activeSubIdx ? "active" : ""}" onclick="applySubtitle(${i}); closeSheet();">${esc(s.label)}</button>
          `).join("")}
        `;
      } else if (type === "episodes") {
        titleEl.textContent = "Pilih Episode";
        const eps = currentDetailData?.episodes || [];
        bodyEl.innerHTML = eps.map((e) => `
          <button class="sheet-opt ${e.season === currentSeason && e.episode === currentEpisode ? "active" : ""}" onclick="startWatch(currentWatchItem, ${e.season || 1}, ${e.episode}); closeSheet();">
            <span>S${e.season || 1} E${e.episode} — ${esc(e.title || `Episode ${e.episode}`)}</span>
          </button>
        `).join("");
      } else if (type === "settings") {
        titleEl.textContent = "Pengaturan Pemutar";
        const speeds = [0.75, 1, 1.25, 1.5, 2];
        bodyEl.innerHTML = speeds.map((sp) => `
          <button class="sheet-opt ${videoEl.playbackRate === sp ? "active" : ""}" onclick="videoEl.playbackRate=${sp}; showToast('Kecepatan ${sp}x'); closeSheet();">
            <span>Kecepatan Putar</span><span>${sp}x</span>
          </button>
        `).join("") + `
          <button class="sheet-opt" onclick="videoEl.style.objectFit = videoEl.style.objectFit === 'cover' ? 'contain' : 'cover'; closeSheet();">
            <span>Mode Layar</span><span>${videoEl.style.objectFit === "cover" ? "Penuh (Crop)" : "Proporsional"}</span>
          </button>
        `;
      }
    }

    // ===== BOOT =====
    (async function init() {
      try {
        const data = await fetch("/api/catalog/home").then((r) => r.json());
        catalog = data;
        heroSlides = [
          ...(catalog.movies || []).slice(0, 3),
          ...(catalog.series || []).slice(0, 2),
          ...(catalog.dramas || []).slice(0, 2),
          ...(catalog.animeTrend || []).slice(0, 2),
        ].filter((x) => x && (x.backdrop || x.poster));
        if (heroSlides.length) {
          heroIdx = 0;
          setHero(heroSlides[0]);
          renderHeroDots();
          restartHeroTimer();
        }
        renderMain();
      } catch {
        document.getElementById("heroTitle").textContent = "SwaraPlay";
      }
    })();
  </script>
</body>
</html>
