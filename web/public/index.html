// =========================================================================
// FULLSCREEN CINEJOY PLAYER ENGINE (MULTI-SERVER + ANTI-OVERLAP SUBTITLES)
// =========================================================================
const videoEl = () => document.getElementById("watchVideo");

async function startPlayback(item, season = 1, episode = 1, episodes = [], resumeSec = 0) {
  if (!item) return;
  S.playerOpen = true;
  S.pItem = item;
  S.pSeason = season;
  S.pEpisode = episode;
  S.pEpisodes = episodes.length ? episodes : S.pEpisodes;
  S.pSources = [];
  S.pActiveSrcIdx = 0;
  S.pSubtitles = [];
  S.pActiveSubIdx = -1;
  S.pCues = [];

  document.getElementById("topbarWrap").classList.add("hidden-nav");
  document.getElementById("playerScreen").classList.add("open", "hud-visible");
  document.getElementById("hudTitle").textContent = item.category === "MOVIE" ? item.title : `${item.title} • S${season} E${episode}`;
  document.getElementById("hudEpisodesBtn").style.display = (item.category !== "MOVIE" && S.pEpisodes.length) ? "inline-flex" : "none";
  document.getElementById("customSubLayer").style.display = "none";
  closePlayerOverlays();
  showPlayerLoader(`Memanggil server untuk ${item.title}...`);
  scheduleHudAutoHide();

  try { history.pushState({ swaraPlayer: true }, ""); } catch {}

  const q = new URLSearchParams({
    id: item.id || "", imdbId: item.imdbId || "", tmdbId: item.tmdbId || "",
    aniListId: item.aniListId || "", malId: item.malId || "", kisskhId: item.kisskhId || "",
    title: item.title || "", year: item.year || "", category: item.category || "MOVIE",
    season: String(season), episode: String(episode),
  });

  // Fetch subtitles in parallel
  fetch(`/api/subtitles?${q.toString()}`).then((r) => r.json()).then((j) => {
    mergeSubtitles(j.subtitles || []);
  }).catch(() => {});

  const normalizeServer = (s, i) => ({
    url: s.streamUrl || s.url || "",
    label: s.name || s.providerName || s.label || `Server ${i + 1}`,
    quality: s.quality || s.qualityLabel || "HD",
    referer: s.referer || "",
    origin: s.origin || "",
    type: s.type || "",
    subtitles: s.subtitles || [],
  });

  // 1) Fast first-wins resolve
  try {
    const r = await fetch(`/api/resolve?${q.toString()}`);
    const j = await r.json();
    const rawList = (j.servers || j.sources || []).map(normalizeServer).filter((x) => x.url);
    const firstSources = sortSourcesByPriority(rawList);
    if (firstSources.length) {
      S.pSources = firstSources;
      updateServersBtnLabel();
      if (j.subtitles) mergeSubtitles(j.subtitles);
      firstSources.forEach((s) => { if (s.subtitles?.length) mergeSubtitles(s.subtitles); });
      loadStreamSource(0, resumeSec);
    }
  } catch {}

  // 2) Full multi-server race in background so Servers drawer has ALL working servers
  fetch(`/api/resolve/servers?${q.toString()}`).then((r) => r.json()).then((j) => {
    const rawAll = (j.servers || j.sources || []).map(normalizeServer).filter((x) => x.url);
    const all = sortSourcesByPriority(rawAll);
    if (!all.length) {
      if (!S.pSources.length) showPlayerLoader("Server sedang sibuk. Coba ulangi atau pilih episode lain.");
      return;
    }
    const currentUrl = S.pSources[S.pActiveSrcIdx]?.url;
    const merged = [...S.pSources];
    for (const src of all) {
      if (!merged.some((x) => x.url === src.url)) merged.push(src);
    }
    S.pSources = sortSourcesByPriority(merged);
    if (currentUrl) {
      const newIdx = S.pSources.findIndex((x) => x.url === currentUrl);
      if (newIdx >= 0) S.pActiveSrcIdx = newIdx;
    } else {
      loadStreamSource(0, resumeSec);
    }
    updateServersBtnLabel();
    if (j.subtitles) mergeSubtitles(j.subtitles);
    all.forEach((s) => { if (s.subtitles?.length) mergeSubtitles(s.subtitles); });
    if (document.getElementById("serversDrawer").classList.contains("open")) renderServersDrawer();
  }).catch(() => {});
}

function sortSourcesByPriority(sources) {
  const order = (S.settings.serverOrder || []).map((x) => x.toLowerCase());
  return [...sources].sort((a, b) => {
    const la = String(a.label || a.name || "").toLowerCase();
    const lb = String(b.label || b.name || "").toLowerCase();
    const ia = order.findIndex((o) => la.includes(o));
    const ib = order.findIndex((o) => lb.includes(o));
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
}

function updateServersBtnLabel() {
  const lbl = document.getElementById("hudServersBtnLabel");
  if (lbl) lbl.textContent = S.pSources.length ? `Servers (${S.pSources.length})` : "Servers";
}

function showPlayerLoader(msg) {
  const l = document.getElementById("playerLoader");
  const st = document.getElementById("loaderStatus");
  if (st) st.textContent = msg;
  if (l) l.classList.add("show");
}
function hidePlayerLoader() {
  document.getElementById("playerLoader")?.classList.remove("show");
}

function loadStreamSource(idx, resumeSec = 0) {
  const src = S.pSources[idx];
  if (!src) return;
  S.pActiveSrcIdx = idx;
  const label = src.label || src.name || `Server ${idx + 1}`;
  showPlayerLoader(`Memuat ${label}...`);

  const v = videoEl();
  if (S.pHls) { S.pHls.destroy(); S.pHls = null; }
  v.pause();

  const proxiedUrl = `/api/proxy?url=${encodeURIComponent(src.url)}&referer=${encodeURIComponent(src.referer || "")}&origin=${encodeURIComponent(src.origin || "")}`;

  const onReady = () => {
    hidePlayerLoader();
    if (resumeSec > 5 && isFinite(v.duration) && resumeSec < v.duration - 15) v.currentTime = resumeSec;
    v.playbackRate = S.pSpeed;
    applyVideoVisuals();
    v.play().catch(() => {});
    updatePlayIcon();
  };

  if (window.Hls && Hls.isSupported() && (src.url.includes(".m3u8") || src.type === "hls" || !src.url.includes(".mp4"))) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      startLevel: -1,
      autoStartLoad: true,
      startFragPrefetch: true,
      maxBufferLength: 18,
      maxMaxBufferLength: 30,
      backBufferLength: 10,
      fragLoadingTimeOut: 8000,
      manifestLoadingTimeOut: 7000,
      levelLoadingTimeOut: 7000,
    });
    S.pHls = hls;
    hls.loadSource(proxiedUrl);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, onReady);
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        if (idx + 1 < S.pSources.length) {
          showToast(`${label} gagal, beralih ke server berikutnya...`);
          loadStreamSource(idx + 1, v.currentTime || resumeSec);
        } else {
          showPlayerLoader("Stream gagal dimuat. Pilih server lain di tombol Servers.");
        }
      }
    });
  } else {
    v.src = proxiedUrl;
    v.onloadedmetadata = onReady;
    v.onerror = () => {
      if (idx + 1 < S.pSources.length) loadStreamSource(idx + 1, v.currentTime || resumeSec);
      else showPlayerLoader("Stream gagal dimuat. Coba pilih server lain.");
    };
  }
}

function closePlayer() {
  saveCurrentWatchProgress();
  const v = videoEl();
  v.pause();
  if (S.pHls) { S.pHls.destroy(); S.pHls = null; }
  v.removeAttribute("src");
  v.load();
  clearTimeout(S.pSleepTimeout);
  S.playerOpen = false;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.getElementById("playerScreen").classList.remove("open");
  document.getElementById("topbarWrap").classList.remove("hidden-nav");
  if (S.route === "home") renderHome();
}

window.addEventListener("popstate", () => {
  if (S.playerOpen) closePlayer();
});

function saveCurrentWatchProgress(finished = false) {
  const v = videoEl();
  if (!S.pItem || !v || !isFinite(v.duration) || v.duration < 30) return;
  const pos = Math.floor(v.currentTime || 0);
  const dur = Math.floor(v.duration || 0);
  const completed = finished || (dur > 0 && pos / dur >= 0.92);
  const entry = {
    id: S.pItem.id,
    imdbId: S.pItem.imdbId || "",
    tmdbId: S.pItem.tmdbId || "",
    title: S.pItem.title,
    category: S.pItem.category,
    poster: S.pItem.poster,
    backdrop: S.pItem.backdrop || S.pItem.poster,
    year: S.pItem.year || "",
    rating: S.pItem.rating || "",
    season: S.pSeason,
    episode: S.pEpisode,
    position: completed ? dur : pos,
    duration: dur,
    completed,
    updatedAt: Date.now(),
  };
  S.history = [entry, ...S.history.filter((x) => x.id !== entry.id)].slice(0, 30);
  saveJson("sp_history_v113", S.history);
  if (completed) {
    // Clean temporary playback caches when finished, keeping only watch history & progress
    S.pCues = [];
    S.pSources = [];
    S.pSubtitles = [];
  }
}

// =========================================================================
// CUSTOM ANTI-OVERLAP SUBTITLE ENGINE (VTT / SRT PARSER + DELAY + UPLOAD)
// =========================================================================
function mergeSubtitles(list) {
  for (const s of list) {
    if (!s || !s.url) continue;
    if (!S.pSubtitles.some((x) => x.url === s.url)) S.pSubtitles.push(s);
  }
  if (S.settings.autoSubtitles && S.pActiveSubIdx === -1 && S.pSubtitles.length) {
    const pref = (S.settings.defaultSubLang || "Bahasa Indonesia").toLowerCase();
    const exact = S.pSubtitles.findIndex((x) => String(x.label || x.lang || "").toLowerCase().includes(pref));
    if (exact >= 0) selectSubtitleTrack(exact);
    else if (pref.includes("indonesia")) {
      const enIdx = S.pSubtitles.findIndex((x) => String(x.label || x.lang || "").toLowerCase().includes("inggris") || String(x.lang || "").toLowerCase() === "en");
      if (enIdx >= 0) selectSubtitleTrack(enIdx, true); // auto translate to Indonesian!
    }
  }
}

async function selectSubtitleTrack(idx, translateToId = false, triedIndices = new Set()) {
  S.pActiveSubIdx = idx;
  if (idx < 0) {
    S.pCues = [];
    document.getElementById("customSubLayer").style.display = "none";
    clearNativeTracks();
    showToast("Subtitle dimatikan");
    return;
  }
  const sub = S.pSubtitles[idx];
  if (!sub) return;
  triedIndices.add(idx);
  const rawTarget = sub.rawUrl || (sub.url.startsWith("/api/sub?url=") ? decodeURIComponent(sub.url.slice("/api/sub?url=".length)) : sub.url);
  const url = translateToId
    ? `/api/sub/translate?url=${encodeURIComponent(rawTarget)}`
    : ((sub.url.startsWith("blob:") || sub.url.startsWith("/api/")) ? sub.url : `/api/sub?url=${encodeURIComponent(rawTarget)}`);
  try {
    let text = await fetch(url).then((r) => r.text());
    try {
      const maybeJson = JSON.parse(text);
      if (typeof maybeJson?.result === "string") text = maybeJson.result;
    } catch {}
    const parsed = parseVttOrSrt(text);
    if (!parsed.length) {
      const wantedIndo = translateToId || String(sub.label || sub.lang || "").toLowerCase().includes("indonesia");
      if (wantedIndo) {
        const nextIndo = S.pSubtitles.findIndex((x, i) => !triedIndices.has(i) && String(x.label || x.lang || "").toLowerCase().includes("indonesia"));
        if (nextIndo >= 0) return selectSubtitleTrack(nextIndo, false, triedIndices);
        // Seamlessly translate the best English track into Bahasa Indonesia while keeping Indonesian active!
        const enIdx = S.pSubtitles.findIndex((x, i) => !triedIndices.has(i) && (String(x.label || "").toLowerCase().includes("inggris") || String(x.lang || "").toLowerCase() === "en"));
        if (enIdx >= 0) {
          showToast("Menerjemahkan subtitle ke Bahasa Indonesia...");
          S.pActiveSubLabel = "Bahasa Indonesia";
          return selectSubtitleTrack(enIdx, true, triedIndices);
        }
      }
      showToast("Track subtitle tidak tersedia — coba track lain");
      return;
    }
    S.pActiveSubLabel = translateToId ? "Bahasa Indonesia" : (sub.label || sub.lang || "Aktif").replace(/\s*#\d+$/, "");
    loadSubtitleText(text, translateToId ? "Bahasa Indonesia (Terjemahan)" : (sub.label || sub.lang), parsed);
  } catch {
    showToast("Gagal memuat subtitle");
  }
}

function loadSubtitleText(rawText, label = "Subtitle", preParsed = null) {
  S.pCues = preParsed || parseVttOrSrt(rawText);
  if (!S.pCues.length) {
    showToast("File subtitle tidak berisi dialog");
    return;
  }
  if (S.settings.subNative) {
    applyNativeTrack(rawText, label);
    document.getElementById("customSubLayer").style.display = "none";
  } else {
    clearNativeTracks();
    document.getElementById("customSubLayer").style.display = "block";
    renderActiveCue();
  }
  showToast(`Subtitle aktif: ${label} (${S.pCues.length} baris)`);
}

function clearNativeTracks() {
  const v = videoEl();
  if (!v) return;
  v.querySelectorAll("track").forEach((t) => t.remove());
}
function applyNativeTrack(vttText, label) {
  clearNativeTracks();
  const v = videoEl();
  if (!v) return;
  const norm = vttText.trim().startsWith("WEBVTT") ? vttText : "WEBVTT\n\n" + vttText.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
  const blob = new Blob([norm], { type: "text/vtt" });
  const tr = document.createElement("track");
  tr.kind = "subtitles"; tr.label = label; tr.srclang = "id"; tr.default = true;
  tr.src = URL.createObjectURL(blob);
  v.appendChild(tr);
  if (v.textTracks[0]) v.textTracks[0].mode = "showing";
}

function parseVttOrSrt(raw) {
  const clean = String(raw || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/^\uFEFF/, "");
  const blocks = clean.split(/\n{2,}/);
  const cues = [];
  const toSec = (t) => {
    const p = t.trim().replace(",", ".").split(":").map(Number);
    if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
    if (p.length === 2) return p[0] * 60 + p[1];
    return 0;
  };
  for (const b of blocks) {
    const lines = b.split("\n").map((l) => l.trim()).filter(Boolean);
    const timeIdx = lines.findIndex((l) => l.includes("-->"));
    if (timeIdx < 0) continue;
    const [a, c] = lines[timeIdx].split("-->");
    const start = toSec(a);
    const end = toSec((c || "").trim().split(/\s+/)[0]);
    const text = lines.slice(timeIdx + 1).join("\n").replace(/<[^>]+>/g, "").trim();
    if (text && end > start) cues.push({ start, end, text });
  }
  return cues;
}

function renderActiveCue() {
  if (S.settings.subNative || !S.pCues.length) {
    document.getElementById("customSubLayer").style.display = "none";
    return;
  }
  const v = videoEl();
  const t = (v?.currentTime || 0) - Number(S.settings.subDelay || 0);
  const hit = S.pCues.find((c) => t >= c.start && t <= c.end);
  const layer = document.getElementById("customSubLayer");
  const txt = document.getElementById("customSubText");
  if (hit) {
    txt.textContent = hit.text;
    layer.style.display = "block";
  } else {
    layer.style.display = "none";
  }
}

function handleSubFileUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    loadSubtitleText(String(reader.result || ""), file.name);
    closePlayerOverlays();
  };
  reader.readAsText(file);
  e.target.value = "";
}

function applyRealHlsLevel(levelIdx, height = 0) {
  if (!S.pHls) return;
  if (levelIdx === -1) {
    S.pTargetQuality = "auto";
    S.pHls.autoLevelCapping = -1;
    S.pHls.currentLevel = -1;
    S.pHls.nextLevel = -1;
    showToast("Kualitas: Auto");
  } else {
    S.pTargetQuality = height ? String(height) : "auto";
    S.pHls.nextLevel = levelIdx;
    S.pHls.currentLevel = levelIdx;
    S.pHls.loadLevel = levelIdx;
    showToast(`Resolusi beralih halus ke ${height ? height + "p" : "pilihan"}`);
  }
}

function applyVideoQuality(q) {
  S.pTargetQuality = q;
  if (!S.pHls) { showToast(`Kualitas diatur: ${q === "auto" ? "Auto" : q + "p"}`); return; }
  if (q === "auto") {
    S.pHls.currentLevel = -1;
    S.pHls.autoLevelCapping = -1;
    showToast("Kualitas: Auto");
    return;
  }
  const target = Number(q);
  const levels = S.pHls.levels || [];
  let bestIdx = -1;
  let bestDiff = 9999;
  levels.forEach((lv, i) => {
    const h = lv.height || 0;
    if (h > 0 && Math.abs(h - target) < bestDiff) { bestDiff = Math.abs(h - target); bestIdx = i; }
  });
  if (bestIdx >= 0 && bestDiff <= 140) {
    S.pHls.currentLevel = bestIdx;
    showToast(`Kualitas dikunci ke ${levels[bestIdx].height}p`);
  } else {
    // Cap max bitrate/height or switch to matching quality server if present
    const altIdx = S.pSources.findIndex((s, i) => i !== S.pActiveSrcIdx && String(s.quality || "").includes(String(target)));
    if (altIdx >= 0) {
      showToast(`Beralih ke server ${target}p...`);
      loadStreamSource(altIdx, videoEl().currentTime || 0);
    } else {
      const capIdx = levels.findIndex((lv) => (lv.height || 9999) <= target);
      if (capIdx >= 0) S.pHls.autoLevelCapping = capIdx;
      showToast(`Preferensi kualitas diatur ke ${target}p`);
    }
  }
}

function togglePlayPause() {
  const v = videoEl();
  if (v.paused) v.play().catch(() => {});
  else v.pause();
  updatePlayIcon();
  scheduleHudAutoHide();
}
function updatePlayIcon() {
  const v = videoEl();
  const btn = document.getElementById("hudPlayBtn");
  if (!btn) return;
  btn.innerHTML = v.paused
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
}
function skipSeconds(dir) {
  const v = videoEl();
  const step = Number(S.settings.seekSeconds || 10);
  v.currentTime = Math.max(0, Math.min(v.duration || 0, (v.currentTime || 0) + dir * step));
  scheduleHudAutoHide();
}
async function togglePiP() {
  const v = videoEl();
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else if (v.requestPictureInPicture) await v.requestPictureInPicture();
    else showToast("Browser ini tidak mendukung Picture-in-Picture");
  } catch { showToast("PiP tidak tersedia saat ini"); }
}
async function toggleFullscreen() {
  const el = document.getElementById("playerScreen");
  try {
    if (!document.fullscreenElement) {
      await el.requestFullscreen();
      if (screen.orientation?.lock) screen.orientation.lock("landscape").catch(() => {});
    } else {
      await document.exitFullscreen();
    }
  } catch { showToast("Layar penuh tidak didukung browser ini"); }
}
async function triggerCast() {
  const v = videoEl();
  if (v.remote && typeof v.remote.prompt === "function") {
    v.remote.prompt().catch(() => showToast("Tidak ada perangkat Cast ditemukan"));
  } else {
    showToast("Gunakan menu Cast browser untuk transmisi ke TV");
  }
}

function applyVideoVisuals() {
  const v = videoEl();
  if (!v) return;
  v.classList.remove("zoom-fill", "zoom-stretch");
  if (S.pZoom === "fill") v.classList.add("zoom-fill");
  else if (S.pZoom === "stretch") v.classList.add("zoom-stretch");
  const filters = [`brightness(${S.pBrightness}%)`];
  if (S.pModifyColors) filters.push(`contrast(${S.pContrast}%)`, `saturate(${S.pSaturate}%)`);
  v.style.filter = filters.join(" ");
  v.playbackRate = S.pSpeed;
}

function setVolumeBoost(pct) {
  S.pVolumeBoost = pct;
  try {
    const v = videoEl();
    if (!S.pAudioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      S.pAudioCtx = new AC();
      const src = S.pAudioCtx.createMediaElementSource(v);
      S.pGainNode = S.pAudioCtx.createGain();
      src.connect(S.pGainNode);
      S.pGainNode.connect(S.pAudioCtx.destination);
    }
    if (S.pAudioCtx.state === "suspended") S.pAudioCtx.resume();
    S.pGainNode.gain.value = pct / 100;
  } catch {}
}

function setSleepTimer(minutes) {
  S.pSleepMinutes = Math.max(0, minutes);
  clearTimeout(S.pSleepTimeout);
  if (S.pSleepMinutes > 0) {
    S.pSleepTimeout = setTimeout(() => {
      videoEl()?.pause();
      updatePlayIcon();
      showToast("Sleep Timer selesai — video dijeda");
      S.pSleepMinutes = 0;
    }, S.pSleepMinutes * 60 * 1000);
    showToast(`Sleep Timer diatur: ${S.pSleepMinutes} menit`);
  }
}

function onStageTap(e) {
  if (e.target.closest("button, input, .servers-drawer, .p-overlay")) return;
  const ps = document.getElementById("playerScreen");
  if (ps.classList.contains("hud-visible")) {
    ps.classList.remove("hud-visible");
    clearTimeout(S.pHudTimer);
  } else {
    ps.classList.add("hud-visible");
    scheduleHudAutoHide();
  }
}
function scheduleHudAutoHide() {
  clearTimeout(S.pHudTimer);
  const ps = document.getElementById("playerScreen");
  ps.classList.add("hud-visible");
  S.pHudTimer = setTimeout(() => {
    const v = videoEl();
    if (S.playerOpen && v && !v.paused && !document.getElementById("playerOverlay").classList.contains("open") && !document.getElementById("serversDrawer").classList.contains("open")) {
      ps.classList.remove("hud-visible");
    }
  }, 3800);
}

            <div class="s-label" style="margin-bottom:8px;">Kecepatan Putar</div>
            <div class="seg-group" style="width:100%;display:grid;grid-template-columns:repeat(5,1fr);">
              ${[0.25, 0.5, 1, 1.5, 2].map((sp) => `<button class="seg-btn ${S.pSpeed === sp ? "active" : ""}" onclick="S.pSpeed=${sp}; applyVideoVisuals(); renderPlayerOverlayContent();">${sp}x</button>`).join("")}
            </div>
          </div>
          <div style="margin-bottom:18px;">
            <div class="s-label" style="margin-bottom:8px;">Mode Zoom</div>
            <div class="seg-group" style="width:100%;display:grid;grid-template-columns:repeat(3,1fr);">
              ${[["original","Original"],["fill","Fill"],["stretch","Stretch"]].map(([z, l]) => `<button class="seg-btn ${S.pZoom === z ? "active" : ""}" onclick="S.pZoom='${z}'; applyVideoVisuals(); renderPlayerOverlayContent();">${l}</button>`).join("")}
            </div>
          </div>
          <div class="s-row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;"><span class="s-label">Volume Boost</span><strong>${S.pVolumeBoost}%</strong></div>
            <input type="range" class="sw-range" min="100" max="400" step="10" value="${S.pVolumeBoost}" oninput="setVolumeBoost(Number(this.value)); renderPlayerOverlayContent();" />
          </div>
          <div class="s-row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;"><span class="s-label">Kecerahan (Brightness)</span><strong>${S.pBrightness}%</strong></div>
            <input type="range" class="sw-range" min="30" max="150" step="5" value="${S.pBrightness}" oninput="S.pBrightness=Number(this.value); applyVideoVisuals(); renderPlayerOverlayContent();" />
          </div>
          <div class="s-row">
            <div><div class="s-label">Modifikasi Warna</div><div class="s-hint">Sesuaikan kontras & saturasi video</div></div>
            <label class="switch"><input type="checkbox" ${S.pModifyColors ? "checked" : ""} onchange="S.pModifyColors=this.checked; applyVideoVisuals(); renderPlayerOverlayContent();" /><span class="slider"></span></label>
          </div>
          ${S.pModifyColors ? `
            <div class="s-row" style="flex-direction:column;align-items:stretch;">
              <div style="display:flex;justify-content:space-between;"><span class="s-label">Kontras</span><strong>${S.pContrast}%</strong></div>
              <input type="range" class="sw-range" min="60" max="160" step="5" value="${S.pContrast}" oninput="S.pContrast=Number(this.value); applyVideoVisuals(); renderPlayerOverlayContent();" />
            </div>
            <div class="s-row" style="flex-direction:column;align-items:stretch;">
              <div style="display:flex;justify-content:space-between;"><span class="s-label">Saturasi</span><strong>${S.pSaturate}%</strong></div>
              <input type="range" class="sw-range" min="40" max="180" step="5" value="${S.pSaturate}" oninput="S.pSaturate=Number(this.value); applyVideoVisuals(); renderPlayerOverlayContent();" />
            </div>
          ` : ""}
        </div>
        <div class="p-overlay-foot"><button class="p-close-bar" onclick="closePlayerOverlays()">TUTUP</button></div>
      `;
    } else if (view === "subtitle") {
      const st = S.settings;
      const subColors = ["#FFFFFF", "#FACC15", "#22D3EE", "#4ADE80", "#E879F9"];
      el.innerHTML = `
        <div class="p-overlay-head"><button class="p-overlay-title" onclick="S.pSettingsView='hub'; renderPlayerOverlayContent();">← Pengaturan Subtitle</button></div>
        <div class="p-overlay-body">
          ${renderToggleRow("Gunakan subtitle bawaan", "Render subtitle memakai mesin native browser", "subNative", st.subNative)}
          ${renderToggleRow("Mode Pastel", "Warna teks subtitle lebih lembut untuk mata", "subPastel", st.subPastel)}
          <div class="s-row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;"><span class="s-label">Delay Subtitle</span><strong>${st.subDelay > 0 ? "+" : ""}${st.subDelay} detik</strong></div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
              <button class="chip" onclick="updateSetting('subDelay', Math.round((S.settings.subDelay-0.5)*10)/10)">-0.5s</button>
              <input type="range" class="sw-range" style="flex:1;" min="-10" max="10" step="0.5" value="${st.subDelay}" oninput="updateSetting('subDelay', Number(this.value))" />
              <button class="chip" onclick="updateSetting('subDelay', Math.round((S.settings.subDelay+0.5)*10)/10)">+0.5s</button>
            </div>
          </div>
          <div class="s-row">
            <span class="s-label">Font</span>
            <div class="seg-group">
              ${["SwaraPlay", "Netflix", "Montserrat"].map((f) => `<button class="seg-btn ${st.subFont === f ? "active" : ""}" onclick="updateSetting('subFont','${f}')">${f}</button>`).join("")}
            </div>
          </div>
          <div class="s-row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;"><span class="s-label">Ukuran Teks</span><strong>${st.subSize}%</strong></div>
            <input type="range" class="sw-range" min="60" max="180" step="5" value="${st.subSize}" oninput="updateSetting('subSize', Number(this.value))" />
          </div>
          <div class="s-row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;"><span class="s-label">Posisi dari Bawah</span><strong>${st.subPos}px</strong></div>
            <input type="range" class="sw-range" min="16" max="160" step="4" value="${st.subPos}" oninput="updateSetting('subPos', Number(this.value))" />
          </div>
          ${renderToggleRow("Latar Belakang", "Tampilkan kotak gelap di belakang subtitle", "subBg", st.subBg)}
          <div class="s-row">
            <span class="s-label">Warna Teks</span>
            <div class="color-dots">
              ${subColors.map((c) => `<button class="color-dot ${st.subColor === c ? "active" : ""}" style="background:${c}" onclick="updateSetting('subColor','${c}')"></button>`).join("")}
            </div>
          </div>
        </div>
        <div class="p-overlay-foot"><button class="p-close-bar" onclick="closePlayerOverlays()">TUTUP</button></div>
      `;
    }
  }
}

// =========================================================================
// VIDEO EVENTS & KEYBOARD SHORTCUTS
// =========================================================================
const vEl = document.getElementById("watchVideo");
vEl.addEventListener("timeupdate", () => {
  if (!S.playerOpen) return;
  const cur = vEl.currentTime || 0;
  const dur = vEl.duration || 0;
  document.getElementById("timeCur").textContent = fmtTime(cur);
  document.getElementById("timeDur").textContent = fmtTime(dur);
  if (dur > 0) document.getElementById("seekBar").value = Math.floor((cur / dur) * 1000);
  renderActiveCue();
  if (Math.floor(cur) % 10 === 0) saveCurrentWatchProgress();
});
vEl.addEventListener("play", updatePlayIcon);
vEl.addEventListener("pause", updatePlayIcon);
vEl.addEventListener("ended", () => {
  saveCurrentWatchProgress(true);
  if (S.pSleepEndOfEp) { S.pSleepEndOfEp = false; return showToast("Berhenti di akhir episode"); }
  if (S.settings.autoplay && S.pEpisodes.length) {
    const idx = S.pEpisodes.findIndex((e) => e.season === S.pSeason && e.episode === S.pEpisode);
    if (idx >= 0 && idx + 1 < S.pEpisodes.length) {
      const nxt = S.pEpisodes[idx + 1];
      showToast(`Memutar berikutnya: S${nxt.season} E${nxt.episode}`);
      startPlayback(S.pItem, nxt.season, nxt.episode, S.pEpisodes, 0);
    }
  }
});
document.getElementById("seekBar").addEventListener("input", (e) => {
  const dur = vEl.duration || 0;
  if (dur > 0) vEl.currentTime = (Number(e.target.value) / 1000) * dur;
});

document.addEventListener("keydown", (e) => {
  if (!S.playerOpen || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlayPause(); }
  else if (e.code === "ArrowRight") { e.preventDefault(); skipSeconds(1); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); skipSeconds(-1); }
  else if (e.key === "f" || e.key === "F") toggleFullscreen();
  else if (e.key === "m" || e.key === "M") { vEl.muted = !vEl.muted; showToast(vEl.muted ? "Suara dibisukan" : "Suara aktif"); }
  else if (e.key === "c" || e.key === "C") openPlayerOverlay("subtitles");
  else if (e.key === "Escape") {
    if (__activePlayerOverlay) closePlayerOverlays();
    else closePlayer();
  }
});

// INIT
applySettings();
navigate("home");
</script>
</body>
</html>
