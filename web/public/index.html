<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070B08" />
  <title>SwaraPlay — Streaming Film & Serial TV</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #070B08;
      --bg-elev: #111613;
      --surface: rgba(18, 24, 20, 0.72);
      --surface2: rgba(26, 34, 28, 0.86);
      --glass: rgba(16, 22, 18, 0.62);
      --glass-strong: rgba(12, 16, 14, 0.86);
      --glass-border: rgba(255, 255, 255, 0.13);
      --text: #FFFFFF;
      --muted: #A1A8A3;
      --accent: #FFFFFF;
      --accent-ink: #070B08;
      --brand-green: #22C55E;
      --brand-glow: rgba(34, 197, 94, 0.28);
      --brand-glow2: rgba(16, 185, 129, 0.18);
      --gold: #F5C518;
      --sub-font: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      --sub-size: 100%;
      --sub-color: #FFFFFF;
      --sub-bg: rgba(10, 12, 10, 0.68);
      --sub-pos: 28px;
    }
    body[data-theme="oled"]     { --bg: #000000; --bg-elev: #0D0D0F; --glass: rgba(16,16,18,0.72); --surface: rgba(18,18,22,0.78); --brand-glow: rgba(255,255,255,0.08); --brand-glow2: rgba(255,255,255,0.04); }
    body[data-theme="midnight"] { --bg: #060A14; --bg-elev: #0E1526; --glass: rgba(12,18,34,0.68); --surface: rgba(15,22,40,0.78); --brand-green: #38BDF8; --brand-glow: rgba(56,189,248,0.26); --brand-glow2: rgba(37,99,235,0.18); }
    body[data-theme="amethyst"] { --bg: #0C0714; --bg-elev: #170F26; --glass: rgba(24,15,38,0.68); --surface: rgba(28,18,44,0.78); --brand-green: #C084FC; --brand-glow: rgba(192,132,252,0.26); --brand-glow2: rgba(139,92,246,0.18); }
    body[data-theme="emerald"]  { --bg: #05110C; --bg-elev: #0C2118; --glass: rgba(10,28,20,0.68); --surface: rgba(14,34,25,0.78); --brand-green: #34D399; --brand-glow: rgba(52,211,153,0.32); --brand-glow2: rgba(16,185,129,0.22); }
    body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { transition: none !important; animation: none !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; }
    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    img { display: block; }

    /* Ambient Wavy Mesh Background (Search, Lists, Settings) */
    .ambient-page {
      min-height: 100vh;
      position: relative;
      background:
        radial-gradient(ellipse 80% 55% at 15% 18%, var(--brand-glow), transparent 65%),
        radial-gradient(ellipse 70% 50% at 85% 28%, var(--brand-glow2), transparent 62%),
        radial-gradient(ellipse 65% 55% at 45% 80%, var(--brand-glow), transparent 70%),
        var(--bg);
    }

    /* ===== TOP FLOATING NAVBAR (CINEJOY STYLE — ZERO BOTTOM NAV!) ===== */
    .topbar-wrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      padding: max(12px, env(safe-area-inset-top)) 20px 8px;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .topbar-wrap.hidden-nav { display: none; }
    .brand-pill {
      pointer-events: auto;
      display: flex; align-items: center; gap: 9px;
      padding: 6px 12px 6px 8px; border-radius: 999px;
      background: var(--glass); backdrop-filter: blur(22px) saturate(165%); -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid var(--glass-border);
      font-weight: 800; font-size: 15.5px; letter-spacing: -0.02em; cursor: pointer;
      box-shadow: 0 8px 28px rgba(0,0,0,0.42);
    }
    .brand-pill img { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; }

    .nav-dock {
      pointer-events: auto;
      display: flex; align-items: center; gap: 4px;
      padding: 5px; border-radius: 999px;
      background: var(--glass-strong); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 36px rgba(0,0,0,0.48);
    }
    .nav-btn {
      padding: 8px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); transition: all .18s ease; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-btn.active { background: var(--accent); color: var(--accent-ink); }
    .nav-icon-btn {
      width: 36px; height: 36px; border-radius: 999px;
      display: grid; place-items: center; color: #fff;
      background: rgba(255,255,255,0.08); transition: background .18s, transform .18s;
      margin-left: 2px;
    }
    .nav-icon-btn:hover { background: rgba(255,255,255,0.2); }
    .nav-icon-btn.active { background: #fff; color: #070B08; }
    .nav-icon-btn svg { width: 17px; height: 17px; }

    /* Gear Dropdown Menu */
    .gear-menu {
      position: fixed; top: 64px; right: 20px; z-index: 80;
      width: 224px; padding: 8px; border-radius: 18px;
      background: rgba(16, 20, 18, 0.92); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 18px 50px rgba(0,0,0,0.65);
      display: none; flex-direction: column; gap: 2px;
    }
    .gear-menu.open { display: flex; }
    .gear-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
      color: #EAEAEA; text-align: left; transition: background .15s;
    }
    .gear-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .gear-item svg { width: 17px; height: 17px; opacity: 0.85; flex-shrink: 0; }
    .gear-sep { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 6px; }

    /* ===== HERO BANNER ===== */
    .hero {
      position: relative; width: 100%; height: min(82vh, 650px); min-height: 460px;
      overflow: hidden; display: flex; align-items: flex-end;
    }
    .hero-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 22%;
      transition: opacity .5s ease, transform 7s ease;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(7,11,8,0.88) 0%, rgba(7,11,8,0.58) 38%, rgba(7,11,8,0.14) 72%, rgba(7,11,8,0.36) 100%),
        linear-gradient(180deg, rgba(7,11,8,0.32) 0%, transparent 28%, rgba(7,11,8,0.68) 78%, rgba(7,11,8,0.92) 100%);
    }
    .hero-inner {
      position: relative; z-index: 2; width: min(1380px, 100%); margin: 0 auto;
      padding: 0 28px 42px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    }
    .hero-copy { max-width: 580px; }
    .hero-logo-wrap { margin-bottom: 14px; min-height: 44px; display: flex; align-items: flex-end; }
    .hero-logo-img { max-height: 112px; max-width: min(390px, 82vw); object-fit: contain; object-position: left bottom; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.65)); }
    .hero-title { font-size: clamp(30px, 4.6vw, 52px); font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; text-shadow: 0 6px 26px rgba(0,0,0,0.6); }
    .hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: #D4D4D8; margin: 10px 0 12px; font-weight: 600; }
    .hero-meta .rating { color: var(--gold); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .hero-desc { font-size: 14.5px; line-height: 1.56; color: #D4D8D5; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn-play {
      background: #fff; color: #070B08; padding: 12px 26px; border-radius: 999px;
      font-weight: 800; font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35); transition: transform .15s, background .15s;
    }
    .btn-play:hover { transform: scale(1.03); background: #F0FDF4; }
    .btn-circle {
      width: 44px; height: 44px; border-radius: 999px;
      background: rgba(255,255,255,0.14); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.2); color: #fff;
      display: grid; place-items: center; transition: background .15s, transform .15s;
    }
    .btn-circle:hover { background: rgba(255,255,255,0.26); transform: scale(1.05); }
    .btn-circle.saved { background: var(--brand-green); color: #041208; border-color: transparent; }
    .btn-circle svg { width: 19px; height: 19px; }
    .hero-dots { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,0.38); backdrop-filter: blur(12px); }
    .hero-dot { width: 7px; height: 7px; border-radius: 999px; background: rgba(255,255,255,0.35); cursor: pointer; transition: all .22s; }
    .hero-dot.active { width: 22px; background: #fff; }

    /* ===== MAIN CONTENT & ROWS ===== */
    .main-container { width: min(1380px, 100%); margin: 0 auto; padding: 8px 28px 96px; }
    .section { margin-bottom: 36px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
    .section-title { font-size: 19.5px; font-weight: 800; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 8px; }
    .section-title-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 19.5px; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
    .section-title-btn:hover { opacity: 0.85; }
    .provider-inline-select {
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      color: #fff; border-radius: 10px; padding: 5px 10px; font-size: 15px; font-weight: 800;
      cursor: pointer; outline: none;
    }
    .provider-inline-select option { background: #121614; color: #fff; }

    .row-scroll {
      display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px;
      scrollbar-width: none; scroll-snap-type: x proximity;
    }
    .row-scroll::-webkit-scrollbar { display: none; }

    /* Home Dynamic Blurred Hero Backdrop */
    .home-blur-bg {
      position: fixed; inset: -40px; z-index: 0; pointer-events: none;
      background-size: cover; background-position: center;
      filter: blur(62px) saturate(1.45) brightness(0.32);
      transform: scale(1.12);
      transition: background-image .7s ease, opacity .5s ease;
      opacity: 0;
    }
    .home-blur-bg.active { opacity: 1; }
    #appRoot { position: relative; z-index: 1; }

    /* Portrait Poster Card (2:3) — STRICT UNIFORM SIZE */
    .card {
      flex: 0 0 158px; width: 158px; min-width: 158px; max-width: 158px;
      cursor: pointer; transition: transform .2s ease; scroll-snap-align: start;
      position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-5px); }
    .card-poster-wrap {
      position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden;
      background: #141916; border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 24px rgba(0,0,0,0.42);
    }
    .card-poster { width: 100%; height: 100%; object-fit: cover; transition: transform .32s ease; }
    .card:hover .card-poster { transform: scale(1.05); }
    .card-badge {
      position: absolute; top: 8px; right: 8px; padding: 3px 7px; border-radius: 8px;
      background: rgba(0,0,0,0.72); backdrop-filter: blur(8px);
      font-size: 11px; font-weight: 700; color: var(--gold);
    }
    .card-title { margin-top: 8px; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    /* Continue Watching 16:9 Card */
    .cw-card {
      flex: 0 0 280px; cursor: pointer; transition: transform .2s ease; position: relative;
    }
    .cw-card:hover { transform: translateY(-4px); }
    .cw-thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
      background: #141916; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 26px rgba(0,0,0,0.48);
    }
    .cw-thumb { width: 100%; height: 100%; object-fit: cover; }
    .cw-thumb-wrap::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,0.82) 100%);
    }
    .cw-progress-track {
      position: absolute; left: 10px; right: 10px; bottom: 8px; height: 4px;
      border-radius: 999px; background: rgba(255,255,255,0.24); z-index: 2; overflow: hidden;
    }
    .cw-progress-fill { height: 100%; background: var(--brand-green); border-radius: 999px; }
    .cw-remove {
      position: absolute; top: 8px; right: 8px; z-index: 3;
      width: 28px; height: 28px; border-radius: 999px;
      background: rgba(0,0,0,0.72); color: #fff; display: none; place-items: center;
      font-size: 14px; font-weight: 700;
    }
    .cw-editing .cw-remove { display: grid; }
    .cw-meta { margin-top: 8px; }
    .cw-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cw-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Browse by Provider Tiles */
    .provider-tile {
      flex: 0 0 88px; display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer;
      transition: transform .18s;
    }
    .provider-tile:hover { transform: translateY(-4px); }
    .provider-box {
      width: 72px; height: 72px; border-radius: 18px;
      background: #121714; border: 1px solid rgba(255,255,255,0.12);
      display: grid; place-items: center; font-weight: 900; font-size: 15px; letter-spacing: -0.02em;
      box-shadow: 0 8px 20px rgba(0,0,0,0.42); transition: border-color .18s, box-shadow .18s;
    }
    .provider-tile.active .provider-box, .provider-tile:hover .provider-box {
      border-color: var(--brand-green); box-shadow: 0 0 0 2px rgba(34,197,94,0.22);
    }
    .provider-name { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Grid Layouts */
    .poster-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(154px, 1fr)); gap: 18px 14px;
    }
    .poster-grid .card { flex: none; width: 100%; min-width: 0; max-width: 100%; }

    /* Genre Chips */
    .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #D4D4D8;
      transition: all .15s;
    }
    .chip.active, .chip:hover { background: #fff; color: #070B08; border-color: #fff; }

    /* ===== DEDICATED SEARCH VIEW ===== */
    .search-page { padding: 110px 28px 90px; }
    .search-hero-box { max-width: 720px; margin: 0 auto 40px; text-align: center; }
    .search-headline { font-size: clamp(26px, 4vw, 38px); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 18px; }
    .search-input-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-radius: 999px;
      background: rgba(16, 22, 18, 0.72); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 12px 36px rgba(0,0,0,0.45);
    }
    .search-input-bar input {
      flex: 1; background: none; border: none; outline: none; font-size: 15.5px; color: #fff;
    }
    .search-input-bar input::placeholder { color: #8F9992; }
    .recent-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
    .recent-chip {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.14); font-size: 12.5px; font-weight: 600;
    }
    .recent-chip span { cursor: pointer; }
    .recent-chip button { font-size: 14px; opacity: 0.7; }
    .recent-chip button:hover { opacity: 1; }

    .skeleton-card { aspect-ratio: 2/3; border-radius: 14px; background: linear-gradient(110deg, rgba(255,255,255,0.06) 8%, rgba(255,255,255,0.14) 18%, rgba(255,255,255,0.06) 33%); background-size: 200% 100%; animation: shimmer 1.25s linear infinite; }
    @keyframes shimmer { to { background-position-x: -200%; } }

    /* ===== QUICK CONTINUE WATCHING POPUP ===== */
    .cw-popup-backdrop {
      position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.68);
      backdrop-filter: blur(8px); display: none; place-items: center; padding: 20px;
    }
    .cw-popup-backdrop.open { display: grid; }
    .cw-popup-card {
      width: min(440px, 100%); border-radius: 22px; overflow: hidden;
      background: #141916; border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 24px 70px rgba(0,0,0,0.75); position: relative;
    }
    .cw-popup-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .cw-popup-close {
      position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 999px;
      background: rgba(0,0,0,0.65); color: #fff; display: grid; place-items: center; font-size: 18px;
    }
    .cw-popup-body { padding: 16px 18px 18px; }
    .cw-popup-title { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .cw-popup-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
    .cw-popup-bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin-bottom: 16px; overflow: hidden; }
    .cw-popup-bar > div { height: 100%; background: var(--brand-green); }
    .cw-popup-actions { display: flex; align-items: center; gap: 10px; }
    .cw-popup-actions .btn-play { flex: 1; justify-content: center; padding: 11px 16px; font-size: 13.5px; }
    .cw-popup-info {
      flex: 1; padding: 11px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
      background: rgba(255,255,255,0.12); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* ===== DETAIL VIEW (MODAL OR FULL PAGE) ===== */
    .detail-overlay {
      position: fixed; inset: 0; z-index: 85; overflow-y: auto;
      background: rgba(0,0,0,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: none; padding: 28px 16px 60px;
    }
    .detail-overlay.open { display: block; }
    .detail-overlay.fullpage-mode { padding: 0; background: var(--bg); backdrop-filter: none; }
    .detail-shell {
      width: min(980px, 100%); margin: 0 auto; border-radius: 26px; overflow: hidden;
      background: #101512; border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 30px 90px rgba(0,0,0,0.8); position: relative;
    }
    .detail-overlay.fullpage-mode .detail-shell {
      width: 100%; border-radius: 0; border: none; min-height: 100vh; background: var(--bg);
    }
    .detail-hero {
      position: relative; min-height: 360px; display: flex; align-items: flex-end; overflow: hidden;
    }
    .detail-hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
    .detail-hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(16,21,18,0.22) 0%, rgba(16,21,18,0.68) 65%, #101512 100%);
    }
    .detail-overlay.fullpage-mode .detail-hero::after {
      background: linear-gradient(180deg, rgba(7,11,8,0.25) 0%, rgba(7,11,8,0.72) 65%, var(--bg) 100%);
    }
    .detail-close-btn {
      position: absolute; top: 18px; right: 18px; z-index: 5;
      width: 40px; height: 40px; border-radius: 999px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; display: grid; place-items: center; font-size: 20px;
    }
    .detail-back-btn {
      position: absolute; top: 18px; left: 18px; z-index: 5;
      padding: 9px 16px; border-radius: 999px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700;
    }
    .detail-hero-content { position: relative; z-index: 2; padding: 110px 28px 24px; width: 100%; }
    .detail-body { padding: 6px 28px 36px; }
    .detail-cols { display: grid; grid-template-columns: 1.55fr 1fr; gap: 26px; margin-bottom: 28px; }
    .detail-meta-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: #D4D8D5; margin-bottom: 12px; font-weight: 600; }
    .meta-tag { padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.12); font-size: 11.5px; font-weight: 700; }
    .detail-overview { font-size: 14.5px; line-height: 1.62; color: #D4D8D5; }
    .detail-cast-box { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .detail-cast-box strong { color: #fff; }
    .cast-strip { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
    .cast-strip::-webkit-scrollbar { display: none; }
    .cast-item { flex: 0 0 74px; text-align: center; }
    .cast-photo { width: 58px; height: 58px; border-radius: 999px; object-fit: cover; margin: 0 auto 5px; background: #1B221E; border: 1px solid rgba(255,255,255,0.14); }
    .cast-name { font-size: 11px; color: #E4E4E7; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Episodes Toolbar & Cards */
    .ep-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .season-trigger {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px; border-radius: 12px; font-size: 15px; font-weight: 800;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16); color: #fff;
    }
    .ep-search-input {
      padding: 9px 14px; border-radius: 999px; width: min(260px, 100%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      font-size: 13px; outline: none;
    }
    .ep-carousel { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .ep-carousel::-webkit-scrollbar { display: none; }
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
    .ep-card {
      flex: 0 0 250px; cursor: pointer; border-radius: 14px; overflow: hidden;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      transition: transform .18s, border-color .18s;
    }
    .ep-grid .ep-card { flex: none; width: 100%; }
    .ep-card:hover { transform: translateY(-3px); border-color: var(--brand-green); }
    .ep-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #161C18; overflow: hidden; }
    .ep-thumb { width: 100%; height: 100%; object-fit: cover; }
    .spoiler-blur { filter: blur(14px) brightness(0.6); }
    .ep-num-badge {
      position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 7px;
      background: rgba(0,0,0,0.74); font-size: 11px; font-weight: 800; color: #fff;
    }
    .ep-dur-badge {
      position: absolute; bottom: 8px; right: 8px; padding: 2px 7px; border-radius: 6px;
      background: rgba(0,0,0,0.74); font-size: 11px; font-weight: 700; color: #D4D4D8;
    }
    .ep-info { padding: 11px 12px 13px; }
    .ep-title { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ep-desc { font-size: 12px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Full-Screen Season Wheel Picker */
    .wheel-overlay {
      position: fixed; inset: 0; z-index: 120;
      background: rgba(7, 11, 8, 0.9); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .wheel-overlay.open { display: flex; }
    .wheel-header { position: absolute; top: 24px; font-size: 15px; font-weight: 700; color: var(--muted); }
    .wheel-close {
      position: absolute; top: 20px; right: 20px; width: 42px; height: 42px; border-radius: 999px;
      background: rgba(255,255,255,0.12); color: #fff; font-size: 20px; display: grid; place-items: center;
    }
    .wheel-list {
      width: min(460px, 100%); max-height: 72vh; overflow-y: auto; scrollbar-width: none;
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px 0;
    }
    .wheel-list::-webkit-scrollbar { display: none; }
    .wheel-item {
      padding: 12px 24px; border-radius: 14px; font-size: 20px; font-weight: 700;
      color: rgba(255,255,255,0.42); transition: all .15s; text-align: center; width: 100%;
    }
    .wheel-item:hover { color: rgba(255,255,255,0.85); }
    .wheel-item.active { color: #fff; font-size: 24px; font-weight: 900; background: rgba(255,255,255,0.1); }

    /* ===== MY LISTS VIEW ===== */
    .lists-page { padding: 104px 28px 90px; }
    .lists-inner { width: min(1200px, 100%); margin: 0 auto; }
    .lists-tabs { display: flex; align-items: center; gap: 22px; margin-bottom: 28px; }
    .lists-tab { font-size: 28px; font-weight: 900; color: rgba(255,255,255,0.4); letter-spacing: -0.02em; }
    .lists-tab.active { color: #fff; }
    .lists-empty-box {
      max-width: 480px; margin: 56px auto; text-align: center;
      padding: 36px 24px; border-radius: 24px;
      background: rgba(16, 22, 18, 0.55); border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
    }
    .dashed-plus {
      width: 140px; height: 94px; margin: 0 auto 20px; border-radius: 16px;
      border: 2px dashed rgba(255,255,255,0.22); display: grid; place-items: center;
      font-size: 28px; color: rgba(255,255,255,0.6); cursor: pointer;
    }
    .lists-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }

    /* ===== ACCOUNT 16-DIGIT KEY MODAL ===== */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 125; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(18px); display: none; place-items: center; padding: 20px;
    }
    .auth-overlay.open { display: grid; }
    .auth-card {
      width: min(410px, 100%); border-radius: 24px; padding: 28px 24px;
      background: rgba(18, 22, 19, 0.94); border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 24px 70px rgba(0,0,0,0.8); text-align: center; position: relative;
    }
    .auth-seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); margin: 16px 0 18px; }
    .auth-seg button { padding: 9px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
    .auth-seg button.active { background: #fff; color: #070B08; }
    .auth-input {
      width: 100%; padding: 13px 16px; border-radius: 12px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      font-size: 15px; letter-spacing: 0.08em; text-align: center; outline: none; margin-bottom: 14px;
    }
    .auth-primary-btn {
      width: 100%; padding: 13px; border-radius: 12px; font-size: 14.5px; font-weight: 800;
      background: #fff; color: #070B08;
    }

    /* ===== SETTINGS PAGE (CINEJOY FULL-SCROLL + STICKY JUMP-NAV) ===== */
    .settings-page { padding: 96px 20px 100px; }
    .settings-inner { width: min(860px, 100%); margin: 0 auto; }
    .settings-title-row { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 900; margin-bottom: 18px; letter-spacing: -0.02em; }
    .settings-jump-nav {
      position: sticky; top: 72px; z-index: 40;
      display: flex; gap: 6px; overflow-x: auto; padding: 6px; margin-bottom: 22px;
      border-radius: 16px; background: rgba(14, 19, 16, 0.86);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.12); scrollbar-width: none;
    }
    .settings-jump-nav::-webkit-scrollbar { display: none; }
    .s-jump-btn {
      padding: 9px 14px; border-radius: 11px; font-size: 13px; font-weight: 700;
      color: var(--muted); white-space: nowrap; transition: all .15s;
    }
    .s-jump-btn.active, .s-jump-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .settings-card {
      padding: 22px 24px; border-radius: 22px; margin-bottom: 20px;
      background: rgba(16, 22, 18, 0.72); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .settings-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .settings-card .sub-desc { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .s-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 13px 0; border-top: 1px solid rgba(255,255,255,0.08);
    }
    .s-row:first-of-type { border-top: none; }
    .s-label { font-size: 14.5px; font-weight: 700; }
    .s-hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .seg-group { display: inline-flex; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); }
    .seg-btn { padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .seg-btn.active { background: #fff; color: #070B08; }

    /* Toggle Switch */
    .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.18); transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;
      border-radius: 999px; background: #fff; transition: transform .2s;
    }
    .switch input:checked + .slider { background: var(--brand-green); }
    .switch input:checked + .slider::before { transform: translateX(20px); }

    .color-dots { display: flex; gap: 9px; align-items: center; }
    .color-dot { width: 24px; height: 24px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; }
    .color-dot.active { border-color: #fff; box-shadow: 0 0 0 2px var(--brand-green); }

    .server-order-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 12px; margin-bottom: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    }
    .server-order-btns { display: flex; gap: 6px; }
    .server-order-btns button {
      width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.1);
      color: #fff; font-weight: 800; display: grid; place-items: center;
    }

    /* ===== FULLSCREEN CINEJOY PLAYER ===== */
    .player-screen {
      position: fixed; inset: 0; z-index: 200; background: #000;
      display: none; flex-direction: column; overflow: hidden; user-select: none;
    }
    .player-screen.open { display: flex; }
    .player-stage { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #watchVideo { width: 100%; height: 100%; object-fit: contain; background: #000; transition: filter .15s; }
    #watchVideo.zoom-fill { object-fit: cover; }
    #watchVideo.zoom-stretch { object-fit: fill; }

    /* Custom Anti-Overlap Subtitle Layer */
    .custom-sub-layer {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: var(--sub-pos); z-index: 12; pointer-events: none;
      max-width: min(86%, 920px); text-align: center;
      transition: bottom .22s ease;
    }
    .player-screen.hud-visible .custom-sub-layer {
      bottom: max(112px, calc(var(--sub-pos) + 86px)) !important;
    }
    .custom-sub-text {
      display: inline-block; padding: 6px 14px; border-radius: 10px;
      font-family: var(--sub-font); font-size: calc(20px * var(--sub-size-num, 1));
      font-weight: 700; line-height: 1.38; color: var(--sub-color);
      background: var(--sub-bg);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      white-space: pre-line;
    }
    .custom-sub-text.no-bg { background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; text-shadow: 0 2px 8px #000, 0 0 4px #000; }
    .custom-sub-text.pastel { opacity: 0.92; filter: saturate(0.75); }

    /* Animated Server Loading Overlay */
    .player-loader {
      position: absolute; inset: 0; z-index: 16; background: rgba(0,0,0,0.78);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .player-loader.show { display: flex; }
    .loader-logo { width: 64px; height: 64px; border-radius: 16px; animation: pulseLogo 1.3s ease-in-out infinite; }
    @keyframes pulseLogo { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.09); opacity: 1; } }
    .loader-status { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }

    /* Player HUD */
    .player-hud {
      position: absolute; inset: 0; z-index: 18;
      display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, transparent 26%, transparent 66%, rgba(0,0,0,0.88) 100%);
      opacity: 0; pointer-events: none; transition: opacity .22s ease;
    }
    .player-screen.hud-visible .player-hud { opacity: 1; pointer-events: auto; }
    .hud-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 20px 10px; gap: 12px;
    }
    .hud-icon-btn {
      width: 48px; height: 48px; border-radius: 999px;
      background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
      display: grid; place-items: center; color: #fff; flex-shrink: 0;
    }
    .hud-icon-btn:hover { background: rgba(255,255,255,0.22); }
    .hud-icon-btn svg { width: 22px; height: 22px; }
    .hud-title { font-size: 16px; font-weight: 800; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .hud-center { display: flex; align-items: center; justify-content: center; gap: 38px; }
    .hud-skip-btn {
      width: 56px; height: 56px; border-radius: 999px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 800;
      background: rgba(0,0,0,0.34); transition: transform .15s, background .15s;
    }
    .hud-skip-btn:hover { background: rgba(255,255,255,0.18); transform: scale(1.06); }
    .hud-play-btn {
      width: 72px; height: 72px; border-radius: 999px;
      background: rgba(255,255,255,0.18); backdrop-filter: blur(14px);
      display: grid; place-items: center; color: #fff; transition: transform .15s;
    }
    .hud-play-btn:hover { transform: scale(1.07); background: rgba(255,255,255,0.28); }
    .hud-play-btn svg { width: 34px; height: 34px; }

    .hud-bottom { padding: 0 22px max(16px, env(safe-area-inset-bottom)); }
    .timeline-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .time-label { font-size: 12.5px; font-weight: 700; color: #E4E4E7; min-width: 52px; font-variant-numeric: tabular-nums; }
    .time-label.right { text-align: right; }
    .seek-bar {
      flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 999px;
      background: rgba(255,255,255,0.26); outline: none; cursor: pointer;
    }
    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 999px;
      background: var(--brand-green); box-shadow: 0 0 0 3px rgba(34,197,94,0.3);
    }
    .hud-actions { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .hud-action-item {
      display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700; color: #E4E4E7; background: rgba(255,255,255,0.08);
      transition: background .15s, color .15s;
    }
    .hud-action-item:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .hud-action-item svg { width: 16px; height: 16px; }

    /* ===== FULL-SCREEN FROSTED PLAYER OVERLAYS (SERVERS / SUBTITLES / SETTINGS / EPISODES) ===== */
    .p-overlay {
      position: absolute; inset: 0; z-index: 30;
      background: rgba(8, 12, 10, 0.9); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
      display: none; flex-direction: column;
    }
    .p-overlay.open { display: flex; }
    .p-overlay-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 22px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .p-overlay-title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .p-overlay-body { flex: 1; overflow-y: auto; padding: 18px 22px 24px; max-width: 820px; width: 100%; margin: 0 auto; }
    .p-overlay-foot {
      padding: 12px 22px max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.1); text-align: center;
    }
    .p-close-bar {
      padding: 10px 36px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em;
      background: rgba(255,255,255,0.12); color: #fff;
    }
    .p-close-bar:hover { background: rgba(255,255,255,0.22); }

    /* Servers Bottom Sheet Drawer */
    .servers-drawer {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 32;
      background: rgba(12, 16, 14, 0.94); backdrop-filter: blur(26px);
      border-top: 1px solid rgba(255,255,255,0.14); border-radius: 22px 22px 0 0;
      padding: 16px 20px max(22px, env(safe-area-inset-bottom));
      max-height: 62vh; overflow-y: auto; display: none;
    }
    .servers-drawer.open { display: block; }
    .server-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 14px; border-radius: 12px; cursor: pointer;
      font-size: 14.5px; font-weight: 700; transition: background .15s;
    }
    .server-row:hover { background: rgba(255,255,255,0.08); }
    .server-row.active { background: rgba(34,197,94,0.14); color: #fff; }

    /* Player Settings 2x2 Cards & Rows */
    .p-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .p-stat-card {
      padding: 14px 16px; border-radius: 14px; text-align: left;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11);
      transition: background .15s;
    }
    .p-stat-card:hover { background: rgba(255,255,255,0.13); }
    .p-stat-k { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
    .p-stat-v { font-size: 15px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-menu-row {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 14px 12px; border-radius: 12px; font-size: 14.5px; font-weight: 700;
      transition: background .15s; text-align: left;
    }
    .p-menu-row:hover { background: rgba(255,255,255,0.08); }

    /* Subtitles Overlay List */
    .sub-search-input {
      width: 100%; padding: 11px 14px; border-radius: 12px; margin: 10px 0 14px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      font-size: 14px; outline: none;
    }
    .sub-lang-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 700;
    }
    .sub-lang-row:hover { background: rgba(255,255,255,0.08); }
    .sub-lang-row.active { background: rgba(34,197,94,0.15); }

    /* Scroll to top & Toast */
    .scroll-top-btn {
      position: fixed; right: 22px; bottom: 24px; z-index: 50;
      width: 44px; height: 44px; border-radius: 999px;
      background: var(--glass-strong); border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px); color: #fff; display: none; place-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .scroll-top-btn.show { display: grid; }
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
      z-index: 300; padding: 10px 18px; border-radius: 999px;
      background: rgba(16, 22, 18, 0.94); border: 1px solid rgba(255,255,255,0.18);
      color: #fff; font-size: 13.5px; font-weight: 700; opacity: 0; pointer-events: none;
      transition: all .22s ease; box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Range Slider */
    input[type="range"].sw-range {
      accent-color: var(--brand-green); cursor: pointer;
    }

    /* ===== FOOTER & DONATION QRIS MODAL ===== */
    .site-footer {
      position: relative; z-index: 2;
      width: min(1380px, 100%); margin: 12px auto 0; padding: 26px 28px 42px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }
    .footer-brand { display: flex; align-items: center; gap: 10px; }
    .footer-brand img { width: 30px; height: 30px; border-radius: 8px; }
    .footer-brand-title { font-size: 15px; font-weight: 800; }
    .footer-brand-sub { font-size: 12px; color: var(--muted); }
    .footer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .footer-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16); color: #fff;

function fmtTime(sec) {

  const s = Math.floor(sec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}` : `${m}:${String(r).padStart(2, "0")}`;
}
function fmtLeft(pos, dur) {
  if (!dur || dur <= 0) return "";
  const left = Math.max(0, Math.round((dur - pos) / 60));
  if (left >= 60) return `${Math.floor(left / 60)}j ${left % 60}m tersisa`;

function applySettings() {
  const st = S.settings;
  document.body.setAttribute("data-theme", st.theme || "default");
  document.body.classList.toggle("reduce-motion", !!st.reduceMotion);
  const root = document.documentElement.style;
  root.setProperty("--sub-font", FONT_MAP[st.subFont] || FONT_MAP.SwaraPlay);
  root.setProperty("--sub-size", `${st.subSize || 100}%`);
  root.setProperty("--sub-size-num", String((st.subSize || 100) / 100));
  root.setProperty("--sub-color", st.subColor || "#FFFFFF");
  root.setProperty("--sub-bg", st.subBg ? "rgba(10, 12, 10, 0.68)" : "transparent");
  root.setProperty("--sub-pos", `${st.subPos ?? 28}px`);

  const subText = document.getElementById("customSubText");
  if (subText) {
    subText.classList.toggle("no-bg", !st.subBg);
    subText.classList.toggle("pastel", !!st.subPastel);
  }
  const sk = String(st.seekSeconds || 10);
  const sb = document.getElementById("skipBackLabel");
  const sf = document.getElementById("skipFwdLabel");
  if (sb) sb.textContent = sk;
  if (sf) sf.textContent = sk;

  const ctrls = st.playerControls || DEFAULT_SETTINGS.playerControls;
  document.querySelectorAll("#hudActionsRow [data-ctrl]").forEach((btn) => {
    const k = btn.getAttribute("data-ctrl");
    if (k === "episodes") return;
    btn.style.display = ctrls[k] === false ? "none" : "inline-flex";
  });

  const authLbl = document.getElementById("gearAuthLabel");
  if (authLbl) authLbl.textContent = S.accountKey ? `Akun (${S.accountKey.slice(0, 4)}••••)` : "Masuk / Akun";
  saveJson("sp_settings_v113", st);
}

function toggleGearMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById("gearMenu").classList.toggle("open");
}
function closeGearMenu() { document.getElementById("gearMenu").classList.remove("open"); }
document.addEventListener("click", (e) => {
  if (!e.target.closest("#gearMenu") && !e.target.closest("#gearBtn")) closeGearMenu();
});
window.addEventListener("scroll", () => {
  const btn = document.getElementById("scrollTopBtn");
  if (btn) btn.classList.toggle("show", window.scrollY > 450 && !S.playerOpen);
});

function navigate(route, opts = {}) {
  S.route = route;
  clearInterval(S.heroTimer);
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("active", el.getAttribute("data-nav") === route);
  });
  window.scrollTo({ top: 0, behavior: "instant" });
  const hbg = document.getElementById("homeBlurBg");
  if (hbg) hbg.classList.toggle("active", route === "home");
  if (route === "home") renderHome();
  else if (route === "movies") { S.catGenre = opts.genre || ""; S.catPage = 1; renderCategory("movie", "Film"); }
  else if (route === "series") { S.catGenre = opts.genre || ""; S.catPage = 1; renderCategory("series", "Serial TV"); }
  else if (route === "lists") renderListsPage();
  else if (route === "search") renderSearchPage();
  else if (route === "settings") renderSettingsPage();
  else if (route === "history") renderHistoryPage();
  else if (route === "calendar") renderCalendarPage();
  else if (route === "provider") renderProviderPage(opts.provider || "netflix");
}

async function ensureHomeData() {
  if (S.home) return S.home;
  const r = await fetch("/api/catalog/home");
  S.home = await r.json();
  return S.home;
}

async function renderHome() {

  try {
    const data = await ensureHomeData();
    const heroPool = [...(data.movies || []).slice(0, 6), ...(data.series || []).slice(0, 4)].filter((x) => x.backdrop || x.poster);
    if (!heroPool.length) {
      root.innerHTML = `<div style="padding:120px 24px;text-align:center;">Gagal memuat katalog. Coba muat ulang halaman.</div>`;
      return;
    }
    const providers = data.providers || [];
    const lastWatched = S.history[0];
    const becauseRow = lastWatched ? [...(data.movies || []), ...(data.series || [])].filter((x) => x.id !== lastWatched.id).slice(0, 16) : [];

    root.innerHTML = `
      <section class="hero" id="heroSection">
        <img class="hero-bg" id="heroBg" src="" alt="" />
        <div class="hero-inner">
          <div class="hero-copy">
            <div class="hero-logo-wrap" id="heroLogoWrap"></div>
            <div class="hero-meta" id="heroMeta"></div>
            <p class="hero-desc" id="heroDesc"></p>
            <div class="hero-actions" id="heroActions"></div>
          </div>
          <div class="hero-dots" id="heroDots">
            ${heroPool.map((_, i) => `<button class="hero-dot ${i === 0 ? "active" : ""}" onclick="setHeroSlide(${i})"></button>`).join("")}
          </div>
        </div>
      </section>

      <div class="main-container">
        ${S.history.length ? renderContinueWatchingSection() : ""}

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Jelajahi per Platform</h2>
          </div>
          <div class="row-scroll">
            ${providers.map((p) => `
              <div class="provider-tile" onclick="navigate('provider', {provider:'${esc(p.id)}'})">

              </div>
            `).join("")}
          </div>
        </section>

        ${becauseRow.length ? renderMediaRow(`Karena kamu menonton ${lastWatched.title}`, becauseRow) : ""}
        ${renderMediaRow("Film Trending", (data.movies || []).slice(0, 20), "movies")}
        ${renderMediaRow("Serial Trending", (data.series || []).slice(0, 20), "series")}

        <section class="section">
          <div class="section-head">
            <div class="section-title">
              <span>Film di</span>
              <select class="provider-inline-select" onchange="switchInlineProvider('movie', this.value)">
                ${providers.map((p) => `<option value="${esc(p.id)}" ${p.id === S.providerMovie ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="row-scroll" id="inlineProvMovieRow"><div style="color:var(--muted);padding:12px;">Memuat...</div></div>
        </section>

        <section class="section">
          <div class="section-head">
            <div class="section-title">
              <span>Serial TV di</span>
              <select class="provider-inline-select" onchange="switchInlineProvider('series', this.value)">
                ${providers.map((p) => `<option value="${esc(p.id)}" ${p.id === S.providerSeries ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="row-scroll" id="inlineProvSeriesRow"><div style="color:var(--muted);padding:12px;">Memuat...</div></div>
        </section>

        ${renderMediaRow("Serial Pemenang Penghargaan", data.awardShows || [])}
        ${renderMediaRow("Film Rating Tertinggi", (data.topMovies || []).slice(0, 20), "movies")}
        ${renderMediaRow("Serial Rating Tertinggi", (data.topSeries || []).slice(0, 20), "series")}
        ${renderMediaRow("Nominasi Oscar Film Terbaik", data.oscarNominees || [])}

function setHeroSlide(idx) {
  S.heroIdx = idx;
  paintHeroSlide(idx);
}

function paintHeroSlide(idx) {
  const pool = window.__heroPool || [];
  const item = pool[idx];
  if (!item) return;
  const bg = document.getElementById("heroBg");
  const bgUrl = item.backdrop || item.poster;
  if (bg) bg.src = bgUrl;
  const hbg = document.getElementById("homeBlurBg");
  if (hbg && bgUrl) {
    hbg.style.backgroundImage = `url("${bgUrl}")`;
    if (S.route === "home") hbg.classList.add("active");
  }

  const logoWrap = document.getElementById("heroLogoWrap");
  if (logoWrap) {
    if (S.settings.useLogos && item.logoUrl) {
      logoWrap.innerHTML = `<img class="hero-logo-img" src="${esc(item.logoUrl)}" alt="${esc(item.title)}" onerror="this.outerHTML='<h1 class=\\'hero-title\\'>${esc(item.title).replace(/'/g, "\\'")}</h1>'" />`;
    } else {
      logoWrap.innerHTML = `<h1 class="hero-title">${esc(item.title)}</h1>`;
    }
  }

  const hist = S.history.find((h) => h.id === item.id);
  const leftStr = hist ? fmtLeft(hist.position, hist.duration) : "";
  const meta = document.getElementById("heroMeta");
  if (meta) {
    meta.innerHTML = `
      ${item.rating ? `<span class="rating">★ ${esc(item.rating)}</span>` : ""}
      ${item.year ? `<span>${esc(item.year)}</span>` : ""}
      ${(item.genres || []).slice(0, 2).map((g) => `<span>• ${esc(g)}</span>`).join("")}
      ${leftStr ? `<span style="color:var(--brand-green)">• ${esc(leftStr)}</span>` : ""}
    `;
  }
  const desc = document.getElementById("heroDesc");
  if (desc) desc.textContent = item.overview || "Streaming kualitas HD dengan subtitle Bahasa Indonesia.";

  const saved = isItemSaved(item.id);
  const act = document.getElementById("heroActions");
  if (act) {
    act.innerHTML = `
      <button class="btn-play" onclick="quickPlayItem(${idx}, 'hero')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <span>${hist ? "Lanjutkan" : "Putar"}</span>
      </button>
      <button class="btn-circle ${saved ? "saved" : ""}" title="Daftar Saya" onclick="toggleQuickSaveHero(${idx})">
        ${saved ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'}
      </button>
      <button class="btn-circle" title="Info Detail" onclick="openDetail(window.__heroPool[${idx}])">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
    `;
  }
  document.querySelectorAll("#heroDots .hero-dot").forEach((d, i) => d.classList.toggle("active", i === idx));
}

function quickPlayItem(idx, source) {
  const item = source === "hero" ? (window.__heroPool || [])[idx] : null;
  if (!item) return;
  const hist = S.history.find((h) => h.id === item.id);
  startPlayback(item, hist?.season || 1, hist?.episode || 1, [], hist?.position || 0);
}
function toggleQuickSaveHero(idx) {
  const item = (window.__heroPool || [])[idx];
  if (!item) return;
  toggleSaveItem(item);
  paintHeroSlide(idx);
}

function toggleCwEdit() {
  S.cwEditing = !S.cwEditing;
  const el = document.getElementById("cwSection");
  if (el) el.classList.toggle("cw-editing", S.cwEditing);
}
function removeHistoryItem(id) {
  S.history = S.history.filter((x) => x.id !== id);
  saveJson("sp_history_v113", S.history);
  if (S.route === "home") renderHome();
  else if (S.route === "history") renderHistoryPage();
}

function openCwPopup(idx) {
  const h = S.history[idx];
  if (!h) return;
  const pct = h.duration > 0 ? Math.min(98, Math.max(4, Math.round((h.position / h.duration) * 100))) : 12;
  const epTxt = h.category !== "MOVIE" ? `Musim ${h.season || 1} Episode ${h.episode || 1} • ` : "";
  const saved = isItemSaved(h.id);
  document.getElementById("cwPopupCard").innerHTML = `
    <img class="cw-popup-img" src="${esc(h.backdrop || h.poster)}" alt="${esc(h.title)}" />
    <button class="cw-popup-close" onclick="closeCwPopup()">✕</button>
    <div class="cw-popup-body">
      <div class="cw-popup-title">${esc(h.title)}</div>
      <div class="cw-popup-sub">${epTxt}${fmtLeft(h.position, h.duration) || "Siap dilanjutkan"}</div>
      <div class="cw-popup-bar"><div style="width:${pct}%"></div></div>
      <div class="cw-popup-actions">
        <button class="btn-play" onclick="closeCwPopup(); startPlayback(S.history[${idx}], ${h.season || 1}, ${h.episode || 1}, [], ${h.position || 0})">▶ Lanjutkan</button>
        <button class="cw-popup-info" onclick="closeCwPopup(); openDetail(S.history[${idx}])">ⓘ Info</button>
        <button class="btn-circle ${saved ? "saved" : ""}" style="width:40px;height:40px;" onclick="toggleSaveItem(S.history[${idx}]); openCwPopup(${idx});">${saved ? "✓" : "+"}</button>
      </div>
    </div>
  `;
  document.getElementById("cwPopup").classList.add("open");
}
function closeCwPopup() { document.getElementById("cwPopup").classList.remove("open"); }

const __itemRegistry = new Map();
function regItem(item) {
  const k = `${item.category || "M"}_${item.id}`;
  __itemRegistry.set(k, item);
  return k;
}
function openByReg(k) {
  const it = __itemRegistry.get(k);
  if (it) openDetail(it);
}

function renderCardHtml(item) {
  if (!item || !item.poster) return "";
  const k = regItem(item);
  return `
    <div class="card" onclick="openByReg('${esc(k)}')">
      <div class="card-poster-wrap">
        <img class="card-poster" src="${esc(item.poster)}" alt="${esc(item.title)}" loading="lazy" onerror="this.closest('.card').style.display='none'" />
        ${item.rating ? `<span class="card-badge">★ ${esc(item.rating)}</span>` : ""}
      </div>
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-sub">${esc(item.year || "")}${item.year ? " • " : ""}${item.category === "MOVIE" ? "Film" : "Serial"}</div>
    </div>
  `;
}

function renderMediaRow(title, items, moreRoute = "") {
  const clean = (items || []).filter((x) => x && x.poster);
  if (!clean.length) return "";
  return `
    <section class="section">
      <div class="section-head">
        ${moreRoute
          ? `<button class="section-title-btn" onclick="navigate('${moreRoute}')"><span>${esc(title)}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg></button>`
          : `<h2 class="section-title">${esc(title)}</h2>`
        }
      </div>
      <div class="row-scroll">${clean.map(renderCardHtml).join("")}</div>
    </section>
  `;
}

async function switchInlineProvider(type, providerId) {
  if (type === "movie") S.providerMovie = providerId;
  else S.providerSeries = providerId;
  const el = document.getElementById(type === "movie" ? "inlineProvMovieRow" : "inlineProvSeriesRow");
  if (!el) return;
  const cacheKey = `${providerId}_${type}`;
  if (!S.providerCache[cacheKey]) {
    el.innerHTML = `<div style="color:var(--muted);padding:12px;">Memuat katalog...</div>`;
    try {
      const r = await fetch(`/api/catalog/provider?provider=${encodeURIComponent(providerId)}&type=${type}`);
      const j = await r.json();
      S.providerCache[cacheKey] = j.items || [];
    } catch { S.providerCache[cacheKey] = []; }
  }
  const items = S.providerCache[cacheKey];
  el.innerHTML = items.length ? items.map(renderCardHtml).join("") : `<div style="color:var(--muted);padding:12px;">Tidak ada konten tersedia.</div>`;
}

async function renderProviderPage(providerId) {
  const data = await ensureHomeData();
  const prov = (data.providers || []).find((p) => p.id === providerId) || { id: providerId, name: providerId };
  const root = document.getElementById("appRoot");
  root.innerHTML = `<div class="ambient-page" style="padding:102px 28px 90px;"><div style="max-width:1340px;margin:0 auto;"><h1 style="font-size:30px;font-weight:900;margin-bottom:24px;">${esc(prov.name)}</h1><div style="color:var(--muted);">Memuat film & serial di ${esc(prov.name)}...</div></div></div>`;
  const [mRes, sRes] = await Promise.all([
    fetch(`/api/catalog/provider?provider=${encodeURIComponent(providerId)}&type=movie`).then((r) => r.json()).catch(() => ({ items: [] })),
    fetch(`/api/catalog/provider?provider=${encodeURIComponent(providerId)}&type=series`).then((r) => r.json()).catch(() => ({ items: [] })),
  ]);
  root.innerHTML = `
    <div class="ambient-page" style="padding:102px 28px 90px;">
      <div style="max-width:1340px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:26px;">
          <button class="btn-circle" onclick="navigate('home')">←</button>
          <h1 style="font-size:30px;font-weight:900;">${esc(prov.name)}</h1>
        </div>
        ${renderMediaRow(`Film di ${prov.name}`, mRes.items || [])}
        ${renderMediaRow(`Serial TV di ${prov.name}`, sRes.items || [])}
      </div>
    </div>
  `;
}

const GENRES_LIST = ["Semua", "Action", "Sci-Fi", "Horror", "Comedy", "Animation", "Thriller", "Fantasy", "Romance", "Crime", "Drama"];
async function renderCategory(cat, label) {
  const root = document.getElementById("appRoot");
  root.innerHTML = `
    <div style="padding:98px 28px 90px;max-width:1380px;margin:0 auto;">
      <h1 style="font-size:28px;font-weight:900;margin-bottom:16px;">${esc(label)} Populer</h1>
      <div class="chips-row">
        ${GENRES_LIST.map((g) => {
          const val = g === "Semua" ? "" : g;
          return `<button class="chip ${S.catGenre === val ? "active" : ""}" onclick="S.catGenre='${val}'; S.catPage=1; renderCategory('${cat}','${label}')">${esc(g)}</button>`;
        }).join("")}
      </div>
      <div class="poster-grid" id="catGrid">${Array(14).fill('<div class="skeleton-card"></div>').join("")}</div>
      <div style="text-align:center;margin-top:28px;">
        <button class="chip" id="catMoreBtn" style="display:none;padding:11px 28px;" onclick="loadMoreCategory('${cat}')">Muat Lebih Banyak</button>
      </div>
    </div>
  `;
  const r = await fetch(`/api/catalog/category?cat=${cat}&genre=${encodeURIComponent(S.catGenre)}&page=1`);
  const j = await r.json();
  S.catItems = (j.items || []).filter((x) => x.poster);
  document.getElementById("catGrid").innerHTML = S.catItems.map(renderCardHtml).join("") || `<div style="color:var(--muted);">Tidak ada judul ditemukan.</div>`;
  const btn = document.getElementById("catMoreBtn");
  if (btn) btn.style.display = j.hasMore ? "inline-block" : "none";
}

async function loadMoreCategory(cat) {
  S.catPage += 1;
  const r = await fetch(`/api/catalog/category?cat=${cat}&genre=${encodeURIComponent(S.catGenre)}&page=${S.catPage}`);
  const j = await r.json();
  const next = (j.items || []).filter((x) => x.poster);
  S.catItems = [...S.catItems, ...next];
  document.getElementById("catGrid").insertAdjacentHTML("beforeend", next.map(renderCardHtml).join(""));
  const btn = document.getElementById("catMoreBtn");
  if (btn && !j.hasMore) btn.style.display = "none";
}

            <input id="searchPageInput" type="text" placeholder="Cari film, serial TV, anime, atau drama..." value="${esc(S.searchQuery)}" oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter') runLiveSearch(this.value, true)" autofocus />
            <button id="searchClearBtn" style="display:${S.searchQuery ? "grid" : "none"};place-items:center;font-size:18px;opacity:.75;" onclick="onSearchInput('')">✕</button>

          <div class="recent-chips" id="recentChipsWrap">${renderRecentChipsHtml()}</div>
        </div>
        <div id="searchResultsArea">
          ${S.searchQuery ? "" : renderMediaRow("Trending Hari Ini", trending)}
        </div>
      </div>
    </div>
  `;
  if (S.searchQuery) runLiveSearch(S.searchQuery, false);
}

function renderRecentChipsHtml() {
  return S.recentSearches.slice(0, 6).map((q, i) => `
    <div class="recent-chip">
      <span onclick="document.getElementById('searchPageInput').value='${esc(q).replace(/'/g, "\\'")}'; runLiveSearch('${esc(q).replace(/'/g, "\\'")}', false)">${esc(q)}</span>
      <button onclick="S.recentSearches.splice(${i},1); saveJson('sp_recent_search_v113', S.recentSearches); document.getElementById('recentChipsWrap').innerHTML=renderRecentChipsHtml();">×</button>
    </div>
  `).join("");
}

function onSearchInput(val) {
  S.searchQuery = val;
  const inp = document.getElementById("searchPageInput");
  if (inp && inp.value !== val) inp.value = val;
  const clr = document.getElementById("searchClearBtn");
  if (clr) clr.style.display = val ? "grid" : "none";
  clearTimeout(S.searchTimer);
  if (!val.trim()) {
    const trending = [...(S.home?.movies || []).slice(0, 10), ...(S.home?.series || []).slice(0, 6)];
    document.getElementById("searchResultsArea").innerHTML = renderMediaRow("Trending Hari Ini", trending);
    return;
  }
  S.searchTimer = setTimeout(() => runLiveSearch(val, false), 340);
}

async function runLiveSearch(q, saveHistory) {
  const clean = String(q || "").trim();
  if (!clean) return;
  S.searchQuery = clean;
  if (saveHistory) {
    S.recentSearches = [clean, ...S.recentSearches.filter((x) => x.toLowerCase() !== clean.toLowerCase())].slice(0, 8);
    saveJson("sp_recent_search_v113", S.recentSearches);
    const rc = document.getElementById("recentChipsWrap");
    if (rc) rc.innerHTML = renderRecentChipsHtml();
  }
  const area = document.getElementById("searchResultsArea");
  if (!area) return;
  area.innerHTML = `<div class="poster-grid">${Array(12).fill('<div class="skeleton-card"></div>').join("")}</div>`;
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(clean)}`);
    const j = await r.json();
    const list = (j.results || []).filter((x) => x && x.poster);
    if (!S.recentSearches.some((x) => x.toLowerCase() === clean.toLowerCase()) && list.length) {
      S.recentSearches = [clean, ...S.recentSearches].slice(0, 8);
      saveJson("sp_recent_search_v113", S.recentSearches);
      const rc = document.getElementById("recentChipsWrap");
      if (rc) rc.innerHTML = renderRecentChipsHtml();
    }
    area.innerHTML = list.length
      ? `<div class="poster-grid">${list.map(renderCardHtml).join("")}</div>`
      : `<div style="text-align:center;color:var(--muted);padding:48px 0;">Tidak ada hasil yang cocok untuk "${esc(clean)}".</div>`;
  } catch {
    area.innerHTML = `<div style="text-align:center;color:var(--muted);padding:48px 0;">Gagal mencari. Coba lagi.</div>`;
  }
}

async function openDetail(item) {
  if (!item) return;
  S.detailItem = item;
  S.detailData = null;
  S.detailSeason = 1;
  S.detailEpQuery = "";
  const overlay = document.getElementById("detailOverlay");
  overlay.classList.toggle("fullpage-mode", S.settings.detailType === "page");
  overlay.classList.add("open");
  overlay.scrollTop = 0;

  // Pre-warm stream in background for instant playback!
  fetch(`/api/resolve?id=${encodeURIComponent(item.id || "")}&imdbId=${encodeURIComponent(item.imdbId || "")}&title=${encodeURIComponent(item.title || "")}&year=${encodeURIComponent(item.year || "")}&category=${encodeURIComponent(item.category || "MOVIE")}&season=1&episode=1`).catch(() => {});

  renderDetailShell();
  try {
    const r = await fetch(`/api/detail?id=${encodeURIComponent(item.id || "")}&category=${encodeURIComponent(item.category || "MOVIE")}&title=${encodeURIComponent(item.title || "")}&totalEpisodes=${item.totalEpisodes || 12}`);
    S.detailData = await r.json();
    const seasons = getDetailSeasons();
    if (seasons.length) S.detailSeason = seasons[0];
    renderDetailShell();
  } catch {}
}

function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("open");
}

function getDetailSeasons() {
  const eps = S.detailData?.episodes || [];
  return [...new Set(eps.map((e) => Number(e.season) || 1))].sort((a, b) => a - b);
}

function getSeasonLabel(sNum) {
  const custom = S.detailData?.seasonNames?.[String(sNum)];
  return custom && custom !== `Season ${sNum}` ? `${custom}` : `Musim ${sNum}`;
}

function toggleSaveItem(item) {

function createNewList() {
  const name = prompt("Nama daftar baru (contoh: Tontonan Akhir Pekan):");

  const id = "list_" + Date.now();
  S.lists.push({ id, name: name.trim(), items: [] });
  S.activeListId = id;
  saveJson("sp_lists_v113", S.lists);
  renderListsPage();
  showToast(`Daftar "${name.trim()}" dibuat`);
}

function exportAllDataJson() {
  const blob = new Blob([JSON.stringify({ accountKey: S.accountKey, lists: S.lists, history: S.history, settings: S.settings }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "swaraplay-backup.json";
  a.click();
  showToast("Cadangan data diekspor");
}

function handleImportJson(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || "{}"));
      if (Array.isArray(parsed.lists)) { S.lists = parsed.lists; saveJson("sp_lists_v113", S.lists); }
      if (Array.isArray(parsed.history)) { S.history = parsed.history; saveJson("sp_history_v113", S.history); }
      if (parsed.settings) { S.settings = { ...DEFAULT_SETTINGS, ...parsed.settings }; applySettings(); }
      showToast("Data berhasil diimpor!");
      if (S.route === "lists") renderListsPage();
      else if (S.route === "settings") renderSettingsPage();
    } catch { showToast("File JSON tidak valid"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function generateAccountKey() {
  const digits = Array.from({ length: 16 }, () => Math.floor(Math.random() * 10)).join("");
  S.accountKey = digits;
  localStorage.setItem("sp_account_key", digits);
  applySettings();
  navigator.clipboard?.writeText(digits).catch(() => {});
  showToast(`Kunci akun dibuat & disalin: ${digits}`);
  closeAuthModal();
  if (S.route === "settings") renderSettingsPage();
}
function submitAccountKey() {
  const val = String(document.getElementById("authKeyInput")?.value || "").replace(/\D/g, "");
  if (val.length < 8) return showToast("Masukkan minimal 8-16 digit angka");
  S.accountKey = val;
  localStorage.setItem("sp_account_key", val);
  applySettings();
  showToast("Berhasil masuk dengan kunci akun");
  closeAuthModal();
  if (S.route === "settings") renderSettingsPage();
}
function logoutAccount() {
  S.accountKey = "";
  localStorage.removeItem("sp_account_key");
  applySettings();
  showToast("Keluar dari akun");
  closeAuthModal();
  if (S.route === "settings") renderSettingsPage();

function moveServerOrder(idx, delta) {
